name: TEST apm-packages-update

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Base branch for the update PR
        required: false
        default: main
        type: string
      target:
        description: Optional APM target override; leave empty to use apm.yml
        required: false
        default: ""
        type: string
      debug:
        description: Print APM and runner diagnostics
        required: false
        default: true
        type: boolean
      dry-run:
        description: Skip pull request creation and run APM in dry-run mode
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  test-apm-update:
    name: Test APM packages update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.APM_UPDATE_TOKEN }}
          persist-credentials: false

      - name: Run apm-packages-update action
        uses: netcracker/qubership-workflow-hub/actions/apm-packages-update@5fd136c16015d889450c2ff5b88e8f4aa925bcbc # fix/try-to-fix-microsoft-apm-action
        with:
          branch: ${{ inputs.branch }}
          debug: ${{ inputs.debug && 'true' || 'false' }}
          dry-run: ${{ inputs['dry-run'] && 'true' || 'false' }}
          target: ${{ inputs.target }}
          token: ${{ secrets.APM_UPDATE_TOKEN }}

      - name: Verify job summary
        run: |
          echo "✅ apm-packages-update action completed successfully"
