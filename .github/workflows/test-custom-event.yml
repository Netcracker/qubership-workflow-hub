name: TEST custom-event

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'actions/custom-event/**'
      - 'packages/action-logger/**'
      - '.github/workflows/test-custom-event.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests and Bundle Verification
    outputs:
      tests: ${{ steps.tests.outcome }}
      build: ${{ steps.build.outcome }}
      dist: ${{ steps.verify-dist.outcome }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        working-directory: actions/custom-event
        run: npm ci

      - name: Run unit tests
        id: tests
        working-directory: actions/custom-event
        run: npm test

      - name: Build dist
        id: build
        working-directory: actions/custom-event
        run: |
          rm -f dist/index.js
          npm run build
          test -s dist/index.js

      - name: Compare checked-in and rebuilt dist
        id: verify-dist
        run: |
          if ! git diff --quiet -- actions/custom-event/dist/; then
            echo "::error::Rebuild and commit custom-event/dist in the PR branch before running action tests."
            exit 1
          fi

  test-dispatch:
    name: Test Dispatch Event
    needs: unit-tests
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Custom Event Action
        id: dispatch
        uses: $/actions/custom-event
        with:
          event-type: test-event
          client-payload: '{"triggered-by": "test-custom-event workflow", "run-id": "${{ github.run_id }}"}'
          github-token: ${{ github.token }}

      - name: Verify output
        env:
          STATUS: ${{ steps.dispatch.outputs.status }}
        run: |
          echo "Dispatch status: $STATUS"
          if [ "$STATUS" != "204" ]; then
            echo "❌ ERROR: expected status 204, got: $STATUS"
            exit 1
          fi
          echo "✅ Custom event dispatched successfully"

  report:
    name: Custom Event Action Report
    if: ${{ always() && !cancelled() }}
    needs: [unit-tests, test-dispatch]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Write test summary
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          TESTS: ${{ needs.unit-tests.outputs.tests }}
          BUILD: ${{ needs.unit-tests.outputs.build }}
          DISPATCH: ${{ needs.test-dispatch.result }}
          DIST: ${{ needs.unit-tests.outputs.dist }}
        run: |
          status_label() {
            case "$1" in
              success) printf '✅ Passed' ;;
              failure) printf '❌ Failed' ;;
              skipped) printf '⏭️ Skipped' ;;
              cancelled) printf '⛔ Cancelled' ;;
              *) printf '❔ Unknown' ;;
            esac
          }

          overall=success
          for result in "${TESTS:-skipped}" "${BUILD:-skipped}" "${DISPATCH:-skipped}" "${DIST:-skipped}"; do
            if [[ "$result" == failure ]]; then
              overall=failure
              break
            fi
            if [[ "$result" != success ]]; then
              overall=skipped
            fi
          done

          {
            echo '<!-- custom-event-test-report -->'
            printf '## Custom event · %s\n\n' "$(status_label "$overall")"
            echo
            echo '| Test | Result |'
            echo '| --- | --- |'
            printf '| Unit tests | %s |\n' "$(status_label "${TESTS:-skipped}")"
            printf '| Bundle build | %s |\n' "$(status_label "${BUILD:-skipped}")"
            printf '| Action dispatch and status verification | %s |\n' "$(status_label "${DISPATCH:-skipped}")"
            printf '| Bundle matches committed dist | %s |\n' "$(status_label "${DIST:-skipped}")"
            echo
            echo "[View workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo '<details>'
            echo '<summary>Tested revision</summary>'
            echo
            echo "PR revision: $HEAD_SHA"
            echo
            echo "Tested commit: $TESTED_SHA"
            echo
            echo '</details>'
          } > "$RUNNER_TEMP/custom-event-report.md"
          cat "$RUNNER_TEMP/custom-event-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update Renovate PR comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'renovate[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          target="repos/$GITHUB_REPOSITORY"
          if [[ "$(gh api "$target/pulls/$PR_NUMBER" --jq .head.sha)" != "$HEAD_SHA" ]]; then
            exit 0
          fi

          comment_id="$(gh api --paginate "$target/issues/$PR_NUMBER/comments" --jq '
            .[] | select(.user.login == "github-actions[bot]" and
              (.body | startswith("<!-- custom-event-test-report -->"))) | .id
          ' | tail -n 1)"
          report="$RUNNER_TEMP/custom-event-report.md"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "$target/issues/comments/$comment_id" -F body=@"$report" --silent
          else
            gh api --method POST "$target/issues/$PR_NUMBER/comments" -F body=@"$report" --silent
          fi

      - name: Require successful validation
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $JOB_RESULTS; do
            if [[ "$result" != success ]]; then
              exit 1
            fi
          done
