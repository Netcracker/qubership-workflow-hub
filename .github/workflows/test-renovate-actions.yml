name: TEST Renovate actions

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "actions/renovate-validate/**"
      - "actions/renovate-lookup/**"
      - "actions/renovate-monitor/**"
      - ".github/workflows/test-renovate-actions.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Renovate action behavior
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test renovate-validate
        working-directory: actions/renovate-validate
        run: python3 -m unittest discover -s tests -v

      - name: Test renovate-lookup
        working-directory: actions/renovate-lookup
        run: python3 -m unittest discover -s tests -v

      - name: Test renovate-monitor
        working-directory: actions/renovate-monitor
        run: python3 -m unittest discover -s tests -v
