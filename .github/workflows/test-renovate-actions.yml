name: TEST Renovate actions

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "actions/renovate-validate/**"
      - "actions/renovate-lookup/**"
      - "actions/renovate-monitor/**"
      - ".github/tests/renovate-actions/**"
      - ".github/workflows/test-renovate-actions.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Renovate action behavior
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run behavior tests
        run: python3 -m unittest discover -s .github/tests/renovate-actions -v
