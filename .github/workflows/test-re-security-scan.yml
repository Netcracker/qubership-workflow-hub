name: Test security scan preparation
on:
  pull_request:
    paths:
      - .github/workflows/re-security-scan.yml
      - .github/workflows/test-re-security-scan.yml
      - tests/re-security-scan/**
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python tests/re-security-scan/test_workflow.py
