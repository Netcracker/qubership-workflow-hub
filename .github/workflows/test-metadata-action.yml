name: TEST metadata-action

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'actions/metadata-action/**'
      - 'packages/action-logger/**'
      - '.github/workflows/test-metadata-action.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-default-template:
    needs: unit-tests
    name: Test Default Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove checked-in dist
        run: rm -rf actions/metadata-action/dist

      - name: Download rebuilt dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: metadata-action-dist-${{ github.run_id }}
          path: actions/metadata-action/dist

      - name: Run Metadata Action
        id: metadata
        uses: $/actions/metadata-action
        with:
          show-report: "true"

      - name: Verify Outputs
        shell: bash
        env:
          RESULT: ${{ steps.metadata.outputs.result }}
          REF: ${{ steps.metadata.outputs.ref }}
          REF_NAME: ${{ steps.metadata.outputs.ref-name }}
          DATE: ${{ steps.metadata.outputs.date }}
          TIME: ${{ steps.metadata.outputs.time }}
          TIMESTAMP: ${{ steps.metadata.outputs.timestamp }}
          DIST_TAG: ${{ steps.metadata.outputs.dist-tag }}
          SHORT_SHA: ${{ steps.metadata.outputs.short-sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "=== Outputs ==="

          echo "result: $RESULT"
          echo "ref: $REF"
          echo "ref-name: $REF_NAME"
          echo "date: $DATE"
          echo "time: $TIME"
          echo "timestamp: $TIMESTAMP"
          echo "dist-tag: $DIST_TAG"
          echo "short-sha: $SHORT_SHA"

          # Verify result matches default template: {{ref-name}}-{{timestamp}}-{{runNumber}}
          EXPECTED_RESULT="${REF_NAME}-${TIMESTAMP}-${RUN_NUMBER}"
          if [ "$RESULT" != "$EXPECTED_RESULT" ]; then
            echo "❌ ERROR: result doesn't match default template"
            echo "   Expected: $EXPECTED_RESULT"
            echo "   Got: $RESULT"
            exit 1
          fi

          # Verify ref is normalized (without "refs/" prefix)
          if [[ "$REF" == refs/* ]]; then
            echo "❌ ERROR: ref should be normalized (without 'refs/' prefix), got: $REF"
            exit 1
          fi

          # Verify date format (YYYYMMDD)
          if ! [[ "$DATE" =~ ^[0-9]{8}$ ]]; then
            echo "❌ ERROR: date format is invalid, expected YYYYMMDD, got: $DATE"
            exit 1
          fi

          # Verify time format (HHMMSS)
          if ! [[ "$TIME" =~ ^[0-9]{6}$ ]]; then
            echo "❌ ERROR: time format is invalid, expected HHMMSS, got: $TIME"
            exit 1
          fi

          # Verify timestamp format (YYYYMMDDHHMMSS)
          if ! [[ "$TIMESTAMP" =~ ^[0-9]{14}$ ]]; then
            echo "❌ ERROR: timestamp format is invalid, expected YYYYMMDDHHMMSS, got: $TIMESTAMP"
            exit 1
          fi

          # Verify short-sha length (default is 7)
          if [ ${#SHORT_SHA} -ne 7 ]; then
            echo "❌ ERROR: short-sha length should be 7, got: ${#SHORT_SHA}"
            exit 1
          fi

          # Verify default dist-tag
          if [ "$DIST_TAG" != "latest" ]; then
            echo "❌ ERROR: default dist-tag should be 'latest', got: $DIST_TAG"
            exit 1
          fi

          echo "✅ Default template test passed!"

  test-custom-template:
    needs: unit-tests
    name: Test Custom Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove checked-in dist
        run: rm -rf actions/metadata-action/dist

      - name: Download rebuilt dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: metadata-action-dist-${{ github.run_id }}
          path: actions/metadata-action/dist

      - name: Run Metadata Action
        id: metadata
        uses: $/actions/metadata-action
        with:
          ref: "refs/heads/feature/test-branch"
          default-template: "custom-{{ref-name}}-{{date}}-{{time}}-{{short-sha}}"
          default-tag: "custom-tag"
          short-sha: "10"
          replace-symbol: "_"
          show-report: "true"

      - name: Verify Outputs
        shell: bash
        env:
          RESULT: ${{ steps.metadata.outputs.result }}
          REF: ${{ steps.metadata.outputs.ref }}
          REF_NAME: ${{ steps.metadata.outputs.ref-name }}
          DATE: ${{ steps.metadata.outputs.date }}
          TIME: ${{ steps.metadata.outputs.time }}
          DIST_TAG: ${{ steps.metadata.outputs.dist-tag }}
          SHORT_SHA: ${{ steps.metadata.outputs.short-sha }}
          MAJOR: ${{ steps.metadata.outputs.major }}
          MINOR: ${{ steps.metadata.outputs.minor }}
          PATCH: ${{ steps.metadata.outputs.patch }}
        run: |
          echo "=== Input Transformation ==="
          INPUT_REF="refs/heads/feature/test-branch"
          REPLACE_SYMBOL="_"
          echo "1. Input ref: $INPUT_REF"
          echo "2. After removing 'refs/heads/': feature/test-branch"
          echo "3. After applying replace-symbol '$REPLACE_SYMBOL': feature_test-branch"

          echo ""
          echo "=== Outputs ==="

          echo "result: $RESULT"
          echo "ref: $REF"
          echo "ref-name: $REF_NAME"
          echo "date: $DATE"
          echo "time: $TIME"
          echo "dist-tag: $DIST_TAG"
          echo "short-sha: $SHORT_SHA"
          echo "major: $MAJOR"
          echo "minor: $MINOR"
          echo "patch: $PATCH"

          if [ "$REF" != "feature_test-branch" ]; then
            echo "❌ ERROR: ref should be 'feature_test-branch', got: $REF"
            exit 1
          fi

          if [ "$REF_NAME" != "feature_test-branch" ]; then
            echo "❌ ERROR: ref-name should be 'feature_test-branch', got: $REF_NAME"
            exit 1
          fi

          EXPECTED_RESULT="custom-${REF_NAME}-${DATE}-${TIME}-${SHORT_SHA}"
          if [ "$RESULT" != "$EXPECTED_RESULT" ]; then
            echo "❌ ERROR: result doesn't match custom template"
            echo "   Expected: $EXPECTED_RESULT"
            echo "   Got: $RESULT"
            exit 1
          fi

          if [ "$DIST_TAG" != "custom-tag" ]; then
            echo "❌ ERROR: dist-tag should be 'custom-tag', got: $DIST_TAG"
            exit 1
          fi

          if [ ${#SHORT_SHA} -ne 10 ]; then
            echo "❌ ERROR: short-sha length should be 10, got: ${#SHORT_SHA}"
            exit 1
          fi

          echo "✅ Custom template test passed!"

  test-github-context:
    needs: unit-tests
    name: Test GitHub Context Variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove checked-in dist
        run: rm -rf actions/metadata-action/dist

      - name: Download rebuilt dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: metadata-action-dist-${{ github.run_id }}
          path: actions/metadata-action/dist

      - name: Run Metadata Action with GitHub Context
        id: metadata
        uses: $/actions/metadata-action
        with:
          default-template: "build-{{github.workflow}}-{{github.sha}}-run{{github.run_number}}"
          default-tag: "context-tag"
          show-report: "true"

      - name: Verify GitHub Context Outputs
        shell: bash
        env:
          RESULT: ${{ steps.metadata.outputs.result }}
          GITHUB_SHA: ${{ github.sha }}
          SHORT_SHA: ${{ steps.metadata.outputs.short-sha }}
        run: |

          echo "result: $RESULT"
          echo "github.sha: $GITHUB_SHA"
          echo "short-sha: $SHORT_SHA"

          if [[ "$RESULT" == *"{{"* ]] || [[ "$RESULT" == *"}}"* ]]; then
            echo "❌ ERROR: result still contains template placeholders"
            exit 1
          fi

          if [[ ! "$RESULT" == build-* ]]; then
            echo "❌ ERROR: result should start with 'build-'"
            exit 1
          fi

          if [[ ! "$RESULT" == *"$GITHUB_SHA"* ]]; then
            echo "❌ ERROR: result should contain full GitHub SHA"
            exit 1
          fi

          EXPECTED_SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ "$SHORT_SHA" != "$EXPECTED_SHORT_SHA" ]; then
            echo "❌ ERROR: short-sha should be first 7 chars of full SHA"
            exit 1
          fi

          echo "✅ GitHub context test passed!"

  test-inline-length-modifier:
    needs: unit-tests
    name: Test Inline Length Modifier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove checked-in dist
        run: rm -rf actions/metadata-action/dist

      - name: Download rebuilt dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: metadata-action-dist-${{ github.run_id }}
          path: actions/metadata-action/dist

      - name: Run Metadata Action with inline length modifier
        id: metadata
        uses: $/actions/metadata-action
        with:
          ref: "refs/heads/feature/my-long-branch-name"
          default-template: "{{ref-name:7}}-{{short-sha:4}}"
          show-report: "true"

      - name: Verify inline length modifier
        shell: bash
        env:
          RESULT: ${{ steps.metadata.outputs.result }}
        run: |
          echo "result: $RESULT"

          # ref-name:7 → 7 chars, short-sha:4 → 4 chars, separator "-" → total 12
          if [ ${#RESULT} -ne 12 ]; then
            echo "❌ ERROR: expected length 12 (7+1+4), got: ${#RESULT} ('$RESULT')"
            exit 1
          fi

          echo "✅ Inline length modifier test passed!"

  unit-tests:
    name: Unit Tests and Build
    outputs:
      tests: ${{ steps.tests.outcome }}
      build: ${{ steps.build.outcome }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        working-directory: actions/metadata-action
        run: npm ci

      - name: Run unit tests
        id: tests
        working-directory: actions/metadata-action
        run: npm test

      - name: Build dist
        id: build
        working-directory: actions/metadata-action
        run: |
          rm -f dist/index.js
          npm run build
          test -s dist/index.js

      - name: Upload rebuilt dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadata-action-dist-${{ github.run_id }}
          path: actions/metadata-action/dist/
          if-no-files-found: error
          overwrite: true

  verify-dist:
    name: Verify Checked-in Dist
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: metadata-action-dist-${{ github.run_id }}
          path: ${{ runner.temp }}/metadata-action-dist

      - name: Compare checked-in and rebuilt dist
        run: diff -qr actions/metadata-action/dist "$RUNNER_TEMP/metadata-action-dist"

  report:
    name: Metadata Action Report
    if: ${{ always() && !cancelled() }}
    needs:
      - unit-tests
      - test-default-template
      - test-custom-template
      - test-github-context
      - test-inline-length-modifier
      - verify-dist
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Write test summary
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTS: ${{ needs.unit-tests.outputs.tests }}
          BUILD: ${{ needs.unit-tests.outputs.build }}
          DEFAULT_TEMPLATE: ${{ needs.test-default-template.result }}
          CUSTOM_TEMPLATE: ${{ needs.test-custom-template.result }}
          GITHUB_CONTEXT: ${{ needs.test-github-context.result }}
          INLINE_LENGTH: ${{ needs.test-inline-length-modifier.result }}
          DIST: ${{ needs.verify-dist.result }}
        run: |
          {
            echo '<!-- metadata-action-test-report -->'
            echo '### Metadata action test report'
            echo
            echo "PR revision: $HEAD_SHA · [Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| JavaScript tests | ${TESTS:-skipped} |"
            echo "| Bundle build | ${BUILD:-skipped} |"
            echo "| Default template | $DEFAULT_TEMPLATE |"
            echo "| Custom template | $CUSTOM_TEMPLATE |"
            echo "| GitHub context | $GITHUB_CONTEXT |"
            echo "| Inline length modifier | $INLINE_LENGTH |"
            echo "| Checked-in dist verification | $DIST |"
          } > "$RUNNER_TEMP/metadata-action-report.md"
          cat "$RUNNER_TEMP/metadata-action-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update Renovate PR comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'renovate[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          target="repos/$GITHUB_REPOSITORY"
          if [[ "$(gh api "$target/pulls/$PR_NUMBER" --jq .head.sha)" != "$HEAD_SHA" ]]; then
            exit 0
          fi

          comment_id="$(gh api --paginate "$target/issues/$PR_NUMBER/comments" --jq '
            .[] | select(.user.login == "github-actions[bot]" and
              (.body | startswith("<!-- metadata-action-test-report -->"))) | .id
          ' | tail -n 1)"
          report="$RUNNER_TEMP/metadata-action-report.md"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "$target/issues/comments/$comment_id" -F body=@"$report" --silent
          else
            gh api --method POST "$target/issues/$PR_NUMBER/comments" -F body=@"$report" --silent
          fi

      - name: Require successful validation
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $JOB_RESULTS; do
            if [[ "$result" != success ]]; then
              exit 1
            fi
          done
