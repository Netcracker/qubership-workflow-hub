name: TEST metadata-action

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'actions/metadata-action/**'
      - 'packages/action-logger/**'
      - '.github/workflows/test-metadata-action.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Build and Test Metadata Action
    outputs:
      tests: ${{ steps.tests.outcome }}
      build: ${{ steps.build.outcome }}
      default-template: ${{ steps.run-default-template.outcome == 'failure' && 'failure' || steps.default-template.outcome }}
      custom-template: ${{ steps.run-custom-template.outcome == 'failure' && 'failure' || steps.custom-template.outcome }}
      github-context: ${{ steps.run-github-context.outcome == 'failure' && 'failure' || steps.github-context.outcome }}
      inline-length: ${{ steps.run-inline-length-modifier.outcome == 'failure' && 'failure' || steps.inline-length-modifier.outcome }}
      dist: ${{ steps.verify-dist.outcome }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        working-directory: actions/metadata-action
        run: npm ci

      - name: Run unit tests
        id: tests
        working-directory: actions/metadata-action
        run: npm test

      - name: Build dist
        id: build
        working-directory: actions/metadata-action
        run: |
          rm -f dist/index.js
          npm run build
          test -s dist/index.js

      - name: Run rebuilt bundle for default-template
        id: run-default-template
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          env \
            'INPUT_SHOW-REPORT=true' \
            'INPUT_SHORT-SHA=7' \
            'INPUT_MERGE-TAGS=true' \
            node actions/metadata-action/dist/index.js

      - name: Verify Outputs
        id: default-template
        if: ${{ !cancelled() && steps.run-default-template.outcome == 'success' }}
        shell: bash
        env:
          RESULT: ${{ steps.run-default-template.outputs.result }}
          REF: ${{ steps.run-default-template.outputs.ref }}
          REF_NAME: ${{ steps.run-default-template.outputs.ref-name }}
          DATE: ${{ steps.run-default-template.outputs.date }}
          TIME: ${{ steps.run-default-template.outputs.time }}
          TIMESTAMP: ${{ steps.run-default-template.outputs.timestamp }}
          DIST_TAG: ${{ steps.run-default-template.outputs.dist-tag }}
          SHORT_SHA: ${{ steps.run-default-template.outputs.short-sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "=== Outputs ==="

          echo "result: $RESULT"
          echo "ref: $REF"
          echo "ref-name: $REF_NAME"
          echo "date: $DATE"
          echo "time: $TIME"
          echo "timestamp: $TIMESTAMP"
          echo "dist-tag: $DIST_TAG"
          echo "short-sha: $SHORT_SHA"

          # Verify result matches default template: {{ref-name}}-{{timestamp}}-{{runNumber}}
          EXPECTED_RESULT="${REF_NAME}-${TIMESTAMP}-${RUN_NUMBER}"
          if [ "$RESULT" != "$EXPECTED_RESULT" ]; then
            echo "❌ ERROR: result doesn't match default template"
            echo "   Expected: $EXPECTED_RESULT"
            echo "   Got: $RESULT"
            exit 1
          fi

          # Verify ref is normalized (without "refs/" prefix)
          if [[ "$REF" == refs/* ]]; then
            echo "❌ ERROR: ref should be normalized (without 'refs/' prefix), got: $REF"
            exit 1
          fi

          # Verify date format (YYYYMMDD)
          if ! [[ "$DATE" =~ ^[0-9]{8}$ ]]; then
            echo "❌ ERROR: date format is invalid, expected YYYYMMDD, got: $DATE"
            exit 1
          fi

          # Verify time format (HHMMSS)
          if ! [[ "$TIME" =~ ^[0-9]{6}$ ]]; then
            echo "❌ ERROR: time format is invalid, expected HHMMSS, got: $TIME"
            exit 1
          fi

          # Verify timestamp format (YYYYMMDDHHMMSS)
          if ! [[ "$TIMESTAMP" =~ ^[0-9]{14}$ ]]; then
            echo "❌ ERROR: timestamp format is invalid, expected YYYYMMDDHHMMSS, got: $TIMESTAMP"
            exit 1
          fi

          # Verify short-sha length (default is 7)
          if [ ${#SHORT_SHA} -ne 7 ]; then
            echo "❌ ERROR: short-sha length should be 7, got: ${#SHORT_SHA}"
            exit 1
          fi

          # Verify default dist-tag
          if [ "$DIST_TAG" != "latest" ]; then
            echo "❌ ERROR: default dist-tag should be 'latest', got: $DIST_TAG"
            exit 1
          fi

          echo "✅ Default template test passed!"

      - name: Run rebuilt bundle for custom-template
        id: run-custom-template
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          env \
            'INPUT_REF=refs/heads/feature/test-branch' \
            'INPUT_DEFAULT-TEMPLATE=custom-{{ref-name}}-{{date}}-{{time}}-{{short-sha}}' \
            'INPUT_DEFAULT-TAG=custom-tag' \
            'INPUT_SHORT-SHA=10' \
            'INPUT_REPLACE-SYMBOL=_' \
            'INPUT_SHOW-REPORT=true' \
            'INPUT_MERGE-TAGS=true' \
            node actions/metadata-action/dist/index.js

      - name: Verify Outputs
        id: custom-template
        if: ${{ !cancelled() && steps.run-custom-template.outcome == 'success' }}
        shell: bash
        env:
          RESULT: ${{ steps.run-custom-template.outputs.result }}
          REF: ${{ steps.run-custom-template.outputs.ref }}
          REF_NAME: ${{ steps.run-custom-template.outputs.ref-name }}
          DATE: ${{ steps.run-custom-template.outputs.date }}
          TIME: ${{ steps.run-custom-template.outputs.time }}
          DIST_TAG: ${{ steps.run-custom-template.outputs.dist-tag }}
          SHORT_SHA: ${{ steps.run-custom-template.outputs.short-sha }}
          MAJOR: ${{ steps.run-custom-template.outputs.major }}
          MINOR: ${{ steps.run-custom-template.outputs.minor }}
          PATCH: ${{ steps.run-custom-template.outputs.patch }}
        run: |
          echo "=== Input Transformation ==="
          INPUT_REF="refs/heads/feature/test-branch"
          REPLACE_SYMBOL="_"
          echo "1. Input ref: $INPUT_REF"
          echo "2. After removing 'refs/heads/': feature/test-branch"
          echo "3. After applying replace-symbol '$REPLACE_SYMBOL': feature_test-branch"

          echo ""
          echo "=== Outputs ==="

          echo "result: $RESULT"
          echo "ref: $REF"
          echo "ref-name: $REF_NAME"
          echo "date: $DATE"
          echo "time: $TIME"
          echo "dist-tag: $DIST_TAG"
          echo "short-sha: $SHORT_SHA"
          echo "major: $MAJOR"
          echo "minor: $MINOR"
          echo "patch: $PATCH"

          if [ "$REF" != "feature_test-branch" ]; then
            echo "❌ ERROR: ref should be 'feature_test-branch', got: $REF"
            exit 1
          fi

          if [ "$REF_NAME" != "feature_test-branch" ]; then
            echo "❌ ERROR: ref-name should be 'feature_test-branch', got: $REF_NAME"
            exit 1
          fi

          EXPECTED_RESULT="custom-${REF_NAME}-${DATE}-${TIME}-${SHORT_SHA}"
          if [ "$RESULT" != "$EXPECTED_RESULT" ]; then
            echo "❌ ERROR: result doesn't match custom template"
            echo "   Expected: $EXPECTED_RESULT"
            echo "   Got: $RESULT"
            exit 1
          fi

          if [ "$DIST_TAG" != "custom-tag" ]; then
            echo "❌ ERROR: dist-tag should be 'custom-tag', got: $DIST_TAG"
            exit 1
          fi

          if [ ${#SHORT_SHA} -ne 10 ]; then
            echo "❌ ERROR: short-sha length should be 10, got: ${#SHORT_SHA}"
            exit 1
          fi

          echo "✅ Custom template test passed!"

      - name: Run rebuilt bundle for github-context
        id: run-github-context
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          env \
            'INPUT_DEFAULT-TEMPLATE=build-{{github.workflow}}-{{github.sha}}-run{{github.run_number}}' \
            'INPUT_DEFAULT-TAG=context-tag' \
            'INPUT_SHOW-REPORT=true' \
            'INPUT_SHORT-SHA=7' \
            'INPUT_MERGE-TAGS=true' \
            node actions/metadata-action/dist/index.js

      - name: Verify GitHub Context Outputs
        id: github-context
        if: ${{ !cancelled() && steps.run-github-context.outcome == 'success' }}
        shell: bash
        env:
          RESULT: ${{ steps.run-github-context.outputs.result }}
          GITHUB_SHA: ${{ github.sha }}
          SHORT_SHA: ${{ steps.run-github-context.outputs.short-sha }}
        run: |

          echo "result: $RESULT"
          echo "github.sha: $GITHUB_SHA"
          echo "short-sha: $SHORT_SHA"

          if [[ "$RESULT" == *"{{"* ]] || [[ "$RESULT" == *"}}"* ]]; then
            echo "❌ ERROR: result still contains template placeholders"
            exit 1
          fi

          if [[ ! "$RESULT" == build-* ]]; then
            echo "❌ ERROR: result should start with 'build-'"
            exit 1
          fi

          if [[ ! "$RESULT" == *"$GITHUB_SHA"* ]]; then
            echo "❌ ERROR: result should contain full GitHub SHA"
            exit 1
          fi

          EXPECTED_SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ "$SHORT_SHA" != "$EXPECTED_SHORT_SHA" ]; then
            echo "❌ ERROR: short-sha should be first 7 chars of full SHA"
            exit 1
          fi

          echo "✅ GitHub context test passed!"

      - name: Run rebuilt bundle for inline-length-modifier
        id: run-inline-length-modifier
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          env \
            'INPUT_REF=refs/heads/feature/my-long-branch-name' \
            'INPUT_DEFAULT-TEMPLATE={{ref-name:7}}-{{short-sha:4}}' \
            'INPUT_SHOW-REPORT=true' \
            'INPUT_SHORT-SHA=7' \
            'INPUT_MERGE-TAGS=true' \
            node actions/metadata-action/dist/index.js

      - name: Verify inline length modifier
        id: inline-length-modifier
        if: ${{ !cancelled() && steps.run-inline-length-modifier.outcome == 'success' }}
        shell: bash
        env:
          RESULT: ${{ steps.run-inline-length-modifier.outputs.result }}
        run: |
          echo "result: $RESULT"

          # ref-name:7 → 7 chars, short-sha:4 → 4 chars, separator "-" → total 12
          if [ ${#RESULT} -ne 12 ]; then
            echo "❌ ERROR: expected length 12 (7+1+4), got: ${#RESULT} ('$RESULT')"
            exit 1
          fi

          echo "✅ Inline length modifier test passed!"

      - name: Compare checked-in and rebuilt dist
        id: verify-dist
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: git diff --exit-code -- actions/metadata-action/dist/

  report:
    name: Metadata Action Report
    if: ${{ always() && !cancelled() }}
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Write test summary
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTS: ${{ needs.unit-tests.outputs.tests }}
          BUILD: ${{ needs.unit-tests.outputs.build }}
          DEFAULT_TEMPLATE: ${{ needs.unit-tests.outputs.default-template }}
          CUSTOM_TEMPLATE: ${{ needs.unit-tests.outputs.custom-template }}
          GITHUB_CONTEXT: ${{ needs.unit-tests.outputs.github-context }}
          INLINE_LENGTH: ${{ needs.unit-tests.outputs.inline-length }}
          DIST: ${{ needs.unit-tests.outputs.dist }}
        run: |
          {
            echo '<!-- metadata-action-test-report -->'
            echo '### Metadata action test report'
            echo
            echo "PR revision: $HEAD_SHA · [Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| JavaScript tests | ${TESTS:-skipped} |"
            echo "| Bundle build | ${BUILD:-skipped} |"
            echo "| Default template | ${DEFAULT_TEMPLATE:-skipped} |"
            echo "| Custom template | ${CUSTOM_TEMPLATE:-skipped} |"
            echo "| GitHub context | ${GITHUB_CONTEXT:-skipped} |"
            echo "| Inline length modifier | ${INLINE_LENGTH:-skipped} |"
            echo "| Checked-in dist verification | ${DIST:-skipped} |"
          } > "$RUNNER_TEMP/metadata-action-report.md"
          cat "$RUNNER_TEMP/metadata-action-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update Renovate PR comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'renovate[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          target="repos/$GITHUB_REPOSITORY"
          if [[ "$(gh api "$target/pulls/$PR_NUMBER" --jq .head.sha)" != "$HEAD_SHA" ]]; then
            exit 0
          fi

          comment_id="$(gh api --paginate "$target/issues/$PR_NUMBER/comments" --jq '
            .[] | select(.user.login == "github-actions[bot]" and
              (.body | startswith("<!-- metadata-action-test-report -->"))) | .id
          ' | tail -n 1)"
          report="$RUNNER_TEMP/metadata-action-report.md"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "$target/issues/comments/$comment_id" -F body=@"$report" --silent
          else
            gh api --method POST "$target/issues/$PR_NUMBER/comments" -F body=@"$report" --silent
          fi

      - name: Require successful validation
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $JOB_RESULTS; do
            if [[ "$result" != success ]]; then
              exit 1
            fi
          done
