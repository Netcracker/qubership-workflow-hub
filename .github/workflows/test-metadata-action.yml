name: TEST metadata-action

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'actions/metadata-action/**'
      - 'packages/action-logger/**'
      - '.github/workflows/test-metadata-action.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Build and Test Metadata Action
    outputs:
      tests: ${{ steps.tests.outcome }}
      build: ${{ steps.build.outcome }}
      dist: ${{ steps.verify-dist.outcome }}
      bundle-changed: ${{ steps.verify-dist.outputs.changed }}
      bundle-artifact: ${{ steps.bundle.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        working-directory: actions/metadata-action
        run: npm ci

      - name: Build dist
        id: build
        working-directory: actions/metadata-action
        run: |
          rm -f dist/index.js
          npm run build
          test -s dist/index.js

      - name: Compare checked-in and rebuilt dist
        id: verify-dist
        env:
          AUTOCOMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ -n "$(git status --porcelain -- actions/metadata-action/dist/)" ]]; then
            if [[ "$AUTOCOMMIT" == true ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Rebuild and commit metadata-action/dist in the PR branch before running action tests."
              exit 1
            fi
          fi

      - name: Run unit tests
        id: tests
        working-directory: actions/metadata-action
        run: npm test

      - name: Upload bundle for Renovate commit
        id: bundle
        if: steps.verify-dist.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadata-action-dist-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: actions/metadata-action/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  test-metadata:
    name: Test committed Metadata Action
    needs: [unit-tests, commit-bundle]
    if: needs.commit-bundle.outputs.ready == 'true'
    outputs:
      default-template: ${{ steps.run-default-template.outcome == 'failure' && 'failure' || steps.default-template.outcome }}
      custom-template: ${{ steps.run-custom-template.outcome == 'failure' && 'failure' || steps.custom-template.outcome }}
      github-context: ${{ steps.run-github-context.outcome == 'failure' && 'failure' || steps.github-context.outcome }}
      inline-length: ${{ steps.run-inline-length-modifier.outcome == 'failure' && 'failure' || steps.inline-length-modifier.outcome }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Metadata Action
        id: run-default-template
        if: ${{ !cancelled() && needs.unit-tests.outputs.tests == 'success' }}
        uses: $/actions/metadata-action
        with:
          show-report: "true"

      - name: Verify Outputs
        id: default-template
        if: ${{ !cancelled() && steps.run-default-template.outcome == 'success' }}
        shell: bash
        env:
          RESULT: ${{ steps.run-default-template.outputs.result }}
          REF: ${{ steps.run-default-template.outputs.ref }}
          REF_NAME: ${{ steps.run-default-template.outputs.ref-name }}
          DATE: ${{ steps.run-default-template.outputs.date }}
          TIME: ${{ steps.run-default-template.outputs.time }}
          TIMESTAMP: ${{ steps.run-default-template.outputs.timestamp }}
          DIST_TAG: ${{ steps.run-default-template.outputs.dist-tag }}
          SHORT_SHA: ${{ steps.run-default-template.outputs.short-sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "=== Outputs ==="

          echo "result: $RESULT"
          echo "ref: $REF"
          echo "ref-name: $REF_NAME"
          echo "date: $DATE"
          echo "time: $TIME"
          echo "timestamp: $TIMESTAMP"
          echo "dist-tag: $DIST_TAG"
          echo "short-sha: $SHORT_SHA"

          # Verify result matches default template: {{ref-name}}-{{timestamp}}-{{runNumber}}
          EXPECTED_RESULT="${REF_NAME}-${TIMESTAMP}-${RUN_NUMBER}"
          if [ "$RESULT" != "$EXPECTED_RESULT" ]; then
            echo "❌ ERROR: result doesn't match default template"
            echo "   Expected: $EXPECTED_RESULT"
            echo "   Got: $RESULT"
            exit 1
          fi

          # Verify ref is normalized (without "refs/" prefix)
          if [[ "$REF" == refs/* ]]; then
            echo "❌ ERROR: ref should be normalized (without 'refs/' prefix), got: $REF"
            exit 1
          fi

          # Verify date format (YYYYMMDD)
          if ! [[ "$DATE" =~ ^[0-9]{8}$ ]]; then
            echo "❌ ERROR: date format is invalid, expected YYYYMMDD, got: $DATE"
            exit 1
          fi

          # Verify time format (HHMMSS)
          if ! [[ "$TIME" =~ ^[0-9]{6}$ ]]; then
            echo "❌ ERROR: time format is invalid, expected HHMMSS, got: $TIME"
            exit 1
          fi

          # Verify timestamp format (YYYYMMDDHHMMSS)
          if ! [[ "$TIMESTAMP" =~ ^[0-9]{14}$ ]]; then
            echo "❌ ERROR: timestamp format is invalid, expected YYYYMMDDHHMMSS, got: $TIMESTAMP"
            exit 1
          fi

          # Verify short-sha length (default is 7)
          if [ ${#SHORT_SHA} -ne 7 ]; then
            echo "❌ ERROR: short-sha length should be 7, got: ${#SHORT_SHA}"
            exit 1
          fi

          # Verify default dist-tag
          if [ "$DIST_TAG" != "latest" ]; then
            echo "❌ ERROR: default dist-tag should be 'latest', got: $DIST_TAG"
            exit 1
          fi

          echo "✅ Default template test passed!"

      - name: Run Metadata Action
        id: run-custom-template
        if: ${{ !cancelled() && needs.unit-tests.outputs.tests == 'success' }}
        uses: $/actions/metadata-action
        with:
          ref: "refs/heads/feature/test-branch"
          default-template: "custom-{{ref-name}}-{{date}}-{{time}}-{{short-sha}}"
          default-tag: "custom-tag"
          short-sha: "10"
          replace-symbol: "_"
          show-report: "true"

      - name: Verify Outputs
        id: custom-template
        if: ${{ !cancelled() && steps.run-custom-template.outcome == 'success' }}
        shell: bash
        env:
          RESULT: ${{ steps.run-custom-template.outputs.result }}
          REF: ${{ steps.run-custom-template.outputs.ref }}
          REF_NAME: ${{ steps.run-custom-template.outputs.ref-name }}
          DATE: ${{ steps.run-custom-template.outputs.date }}
          TIME: ${{ steps.run-custom-template.outputs.time }}
          DIST_TAG: ${{ steps.run-custom-template.outputs.dist-tag }}
          SHORT_SHA: ${{ steps.run-custom-template.outputs.short-sha }}
          MAJOR: ${{ steps.run-custom-template.outputs.major }}
          MINOR: ${{ steps.run-custom-template.outputs.minor }}
          PATCH: ${{ steps.run-custom-template.outputs.patch }}
        run: |
          echo "=== Input Transformation ==="
          INPUT_REF="refs/heads/feature/test-branch"
          REPLACE_SYMBOL="_"
          echo "1. Input ref: $INPUT_REF"
          echo "2. After removing 'refs/heads/': feature/test-branch"
          echo "3. After applying replace-symbol '$REPLACE_SYMBOL': feature_test-branch"

          echo ""
          echo "=== Outputs ==="

          echo "result: $RESULT"
          echo "ref: $REF"
          echo "ref-name: $REF_NAME"
          echo "date: $DATE"
          echo "time: $TIME"
          echo "dist-tag: $DIST_TAG"
          echo "short-sha: $SHORT_SHA"
          echo "major: $MAJOR"
          echo "minor: $MINOR"
          echo "patch: $PATCH"

          if [ "$REF" != "feature_test-branch" ]; then
            echo "❌ ERROR: ref should be 'feature_test-branch', got: $REF"
            exit 1
          fi

          if [ "$REF_NAME" != "feature_test-branch" ]; then
            echo "❌ ERROR: ref-name should be 'feature_test-branch', got: $REF_NAME"
            exit 1
          fi

          EXPECTED_RESULT="custom-${REF_NAME}-${DATE}-${TIME}-${SHORT_SHA}"
          if [ "$RESULT" != "$EXPECTED_RESULT" ]; then
            echo "❌ ERROR: result doesn't match custom template"
            echo "   Expected: $EXPECTED_RESULT"
            echo "   Got: $RESULT"
            exit 1
          fi

          if [ "$DIST_TAG" != "custom-tag" ]; then
            echo "❌ ERROR: dist-tag should be 'custom-tag', got: $DIST_TAG"
            exit 1
          fi

          if [ ${#SHORT_SHA} -ne 10 ]; then
            echo "❌ ERROR: short-sha length should be 10, got: ${#SHORT_SHA}"
            exit 1
          fi

          echo "✅ Custom template test passed!"

      - name: Run Metadata Action with GitHub Context
        id: run-github-context
        if: ${{ !cancelled() && needs.unit-tests.outputs.tests == 'success' }}
        uses: $/actions/metadata-action
        with:
          default-template: "build-{{github.workflow}}-{{github.sha}}-run{{github.run_number}}"
          default-tag: "context-tag"
          show-report: "true"

      - name: Verify GitHub Context Outputs
        id: github-context
        if: ${{ !cancelled() && steps.run-github-context.outcome == 'success' }}
        shell: bash
        env:
          RESULT: ${{ steps.run-github-context.outputs.result }}
          GITHUB_SHA: ${{ github.sha }}
          SHORT_SHA: ${{ steps.run-github-context.outputs.short-sha }}
        run: |

          echo "result: $RESULT"
          echo "github.sha: $GITHUB_SHA"
          echo "short-sha: $SHORT_SHA"

          if [[ "$RESULT" == *"{{"* ]] || [[ "$RESULT" == *"}}"* ]]; then
            echo "❌ ERROR: result still contains template placeholders"
            exit 1
          fi

          if [[ ! "$RESULT" == build-* ]]; then
            echo "❌ ERROR: result should start with 'build-'"
            exit 1
          fi

          if [[ ! "$RESULT" == *"$GITHUB_SHA"* ]]; then
            echo "❌ ERROR: result should contain full GitHub SHA"
            exit 1
          fi

          EXPECTED_SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ "$SHORT_SHA" != "$EXPECTED_SHORT_SHA" ]; then
            echo "❌ ERROR: short-sha should be first 7 chars of full SHA"
            exit 1
          fi

          echo "✅ GitHub context test passed!"

      - name: Run Metadata Action with inline length modifier
        id: run-inline-length-modifier
        if: ${{ !cancelled() && needs.unit-tests.outputs.tests == 'success' }}
        uses: $/actions/metadata-action
        with:
          ref: "refs/heads/feature/my-long-branch-name"
          default-template: "{{ref-name:7}}-{{short-sha:4}}"
          show-report: "true"

      - name: Verify inline length modifier
        id: inline-length-modifier
        if: ${{ !cancelled() && steps.run-inline-length-modifier.outcome == 'success' }}
        shell: bash
        env:
          RESULT: ${{ steps.run-inline-length-modifier.outputs.result }}
        run: |
          echo "result: $RESULT"

          # ref-name:7 → 7 chars, short-sha:4 → 4 chars, separator "-" → total 12
          if [ ${#RESULT} -ne 12 ]; then
            echo "❌ ERROR: expected length 12 (7+1+4), got: ${#RESULT} ('$RESULT')"
            exit 1
          fi

          echo "✅ Inline length modifier test passed!"

  commit-bundle:
    name: Commit metadata-action bundle
    needs: unit-tests
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.commit.outputs.ready }}
    steps:
      - name: Checkout source for bundle commit
        if: needs.unit-tests.outputs.bundle-changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download rebuilt bundle
        if: needs.unit-tests.outputs.bundle-changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.unit-tests.outputs.bundle-artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/rebuilt-bundle

      - name: Create repository-scoped app token
        if: needs.unit-tests.outputs.bundle-changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.GH_BUMP_VERSION_APP_ID }}
          private-key: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}
          permission-contents: write

      - name: Commit bundle or continue integration tests
        id: commit
        env:
          BUNDLE_CHANGED: ${{ needs.unit-tests.outputs.bundle-changed }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$BUNDLE_CHANGED" != true ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s "$RUNNER_TEMP/rebuilt-bundle/index.js"
          if [[ -n "$(find "$RUNNER_TEMP/rebuilt-bundle" -type l -print -quit)" ]]; then
            echo '::error::Bundle contains a symbolic link'
            exit 1
          fi
          gh auth setup-git
          remote_sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f 1)
          if [[ "$remote_sha" != "$HEAD_SHA" ]]; then
            echo 'PR changed during this build. Its newer run will rebuild the current bundle.'
            exit 0
          fi
          rm -rf actions/metadata-action/dist
          mkdir -p actions/metadata-action/dist
          cp -a "$RUNNER_TEMP/rebuilt-bundle/." actions/metadata-action/dist/
          git add -- actions/metadata-action/dist/
          git -c core.hooksPath=/dev/null \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(deps): rebuild metadata-action bundle'
          if ! git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$BRANCH"; then
            remote_sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f 1)
            if [[ "$remote_sha" != "$HEAD_SHA" ]]; then
              echo 'Another workflow updated this PR. Its newer run will retry the bundle.'
              exit 0
            fi
            echo '::error::Could not push the rebuilt bundle'
            exit 1
          fi
          echo 'Bundle committed. The App push starts PR checks on the new commit.'

  report:
    name: Metadata Action Report
    if: ${{ always() && !cancelled() }}
    needs: [unit-tests, commit-bundle, test-metadata]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Write test summary
        if: needs.commit-bundle.outputs.ready == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          TESTS: ${{ needs.unit-tests.outputs.tests }}
          BUILD: ${{ needs.unit-tests.outputs.build }}
          DEFAULT_TEMPLATE: ${{ needs.test-metadata.outputs.default-template }}
          CUSTOM_TEMPLATE: ${{ needs.test-metadata.outputs.custom-template }}
          GITHUB_CONTEXT: ${{ needs.test-metadata.outputs.github-context }}
          INLINE_LENGTH: ${{ needs.test-metadata.outputs.inline-length }}
          DIST: ${{ needs.unit-tests.outputs.dist }}
        run: |
          status_label() {
            case "$1" in
              success) printf '✅ Passed' ;;
              failure) printf '❌ Failed' ;;
              skipped) printf '⏭️ Skipped' ;;
              cancelled) printf '⛔ Cancelled' ;;
              *) printf '❔ Unknown' ;;
            esac
          }

          overall=success
          for result in "${TESTS:-skipped}" "${BUILD:-skipped}" "${DEFAULT_TEMPLATE:-skipped}" "${CUSTOM_TEMPLATE:-skipped}" "${GITHUB_CONTEXT:-skipped}" "${INLINE_LENGTH:-skipped}" "${DIST:-skipped}"; do
            if [[ "$result" == failure ]]; then
              overall=failure
              break
            fi
            if [[ "$result" != success ]]; then
              overall=skipped
            fi
          done

          {
            echo '<!-- metadata-action-test-report -->'
            printf '## Metadata action · %s\n\n' "$(status_label "$overall")"
            echo
            echo '| Test | Result |'
            echo '| --- | --- |'
            printf '| Unit tests | %s |\n' "$(status_label "${TESTS:-skipped}")"
            printf '| Bundle build | %s |\n' "$(status_label "${BUILD:-skipped}")"
            printf '| Default template | %s |\n' "$(status_label "${DEFAULT_TEMPLATE:-skipped}")"
            printf '| Custom template | %s |\n' "$(status_label "${CUSTOM_TEMPLATE:-skipped}")"
            printf '| GitHub context | %s |\n' "$(status_label "${GITHUB_CONTEXT:-skipped}")"
            printf '| Inline length modifier | %s |\n' "$(status_label "${INLINE_LENGTH:-skipped}")"
            printf '| Bundle matches committed dist | %s |\n' "$(status_label "${DIST:-skipped}")"
            echo
            echo "[View workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo '<details>'
            echo '<summary>Tested revision</summary>'
            echo
            echo "PR revision: $HEAD_SHA"
            echo
            echo "Tested commit: $TESTED_SHA"
            echo
            echo '</details>'
          } > "$RUNNER_TEMP/metadata-action-report.md"
          cat "$RUNNER_TEMP/metadata-action-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update Renovate PR comment
        if: >-
          needs.commit-bundle.outputs.ready == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'renovate[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          target="repos/$GITHUB_REPOSITORY"
          if [[ "$(gh api "$target/pulls/$PR_NUMBER" --jq .head.sha)" != "$HEAD_SHA" ]]; then
            exit 0
          fi

          comment_id="$(gh api --paginate "$target/issues/$PR_NUMBER/comments" --jq '
            .[] | select(.user.login == "github-actions[bot]" and
              (.body | startswith("<!-- metadata-action-test-report -->"))) | .id
          ' | tail -n 1)"
          report="$RUNNER_TEMP/metadata-action-report.md"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "$target/issues/comments/$comment_id" -F body=@"$report" --silent
          else
            gh api --method POST "$target/issues/$PR_NUMBER/comments" -F body=@"$report" --silent
          fi

      - name: Require successful validation
        if: needs.commit-bundle.outputs.ready == 'true'
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $JOB_RESULTS; do
            if [[ "$result" != success ]]; then
              exit 1
            fi
          done

      - name: Require successful bundle preparation
        if: needs.unit-tests.result != 'success' || needs.commit-bundle.result != 'success'
        run: |
          echo '::error::Unit tests, bundle build, or bundle commit failed.'
          exit 1
