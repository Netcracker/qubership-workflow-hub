name: TEST docker-action

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'actions/docker-action/**'
      - '.github/workflows/test-docker-action.yml'
      - '.qubership/Dockerfile.test'

env:
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test-with-default-action:
    name: Test with Defaults (component fields omitted)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Docker Action without Component Name
        id: docker-default-name
        uses: $/actions/docker-action
        with:
          dry-run: "true"
          registry: "ghcr.io"
          component: '[{"dockerfile": "./.qubership/Dockerfile.test", "build_context": "."}]'

      - name: Verify Default Component Name
        shell: bash
        env:
          ACTION_COMPONENT_NAME: ${{ steps.docker-default-name.outputs.component-name }}
          ACTION_FINAL_TAGS: ${{ steps.docker-default-name.outputs.final-tags }}
          ACTION_IMAGE_NAME: ${{ steps.docker-default-name.outputs.image-name }}
        run: |
          echo "=== Outputs ==="
          echo "Component Name: $ACTION_COMPONENT_NAME"
          echo "Final Tags: $ACTION_FINAL_TAGS"
          echo "Image Name: $ACTION_IMAGE_NAME"

          # Verify component name defaults to "default" (from JSON parsing)
          EXPECTED_NAME="default"
          ACTUAL_NAME="$ACTION_COMPONENT_NAME"
          if [ "$ACTUAL_NAME" != "$EXPECTED_NAME" ]; then
            echo "❌ ERROR: Component name should default to 'default'"
            echo "Expected: $EXPECTED_NAME"
            echo "Actual: $ACTUAL_NAME"
            exit 1
          fi

          # When component name is "default", the image should use repository name instead
          # Extract repo name from GITHUB_REPOSITORY (owner/repo -> repo)
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          TAGS="$ACTION_FINAL_TAGS"

          if [[ ! "$TAGS" == *"$REPO_NAME"* ]]; then
            echo "❌ ERROR: Tags should contain repository name '$REPO_NAME' when component is 'default'"
            echo "Actual tags: $TAGS"
            exit 1
          fi

          # Verify tags don't literally contain "/default:" as image name
          if [[ "$TAGS" == *"/default:"* ]]; then
            echo "❌ ERROR: Tags should NOT use 'default' as image name, should use repo name instead"
            exit 1
          fi

          echo "✅ Default component name test passed!"
  test-auto-tags:
    name: Test with Auto-Generated Tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Docker Action with Auto Tags
        id: docker-auto
        uses: $/actions/docker-action
        with:
          dry-run: "true"
          registry: "ghcr.io"
          platforms: "linux/amd64"
          component: '[{"name": "test-auto", "dockerfile": "./.qubership/Dockerfile.test", "build_context": "."}]'

      - name: Verify exact auto tags and resolved parameters
        env:
          TAGS: ${{ steps.docker-auto.outputs.final-tags }}
          PLATFORMS: ${{ steps.docker-auto.outputs.final-platforms }}
          COMPONENT: ${{ steps.docker-auto.outputs.component-name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            tag="pr-$PR_NUMBER"
          else
            tag=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9_.-]/-/g' | tr '[:upper:]' '[:lower:]')
          fi
          test "$TAGS" = "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/test-auto:$tag"
          test "$PLATFORMS" = linux/amd64
          test "$COMPONENT" = test-auto

  test-custom-tags:
    name: Test with Custom Tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Docker Action with Custom Tags
        id: docker-custom
        uses: $/actions/docker-action
        with:
          dry-run: "true"
          registry: "ghcr.io"
          platforms: "linux/amd64,linux/arm64"
          custom-image-name: test-override
          tags: "v1.0.0,latest,custom-tag"
          component: '[{"name": "test-custom", "dockerfile": "./.qubership/Dockerfile.test", "build_context": "."}]'

      - name: Verify exact custom tags and platforms
        env:
          TAGS: ${{ steps.docker-custom.outputs.final-tags }}
          PLATFORMS: ${{ steps.docker-custom.outputs.final-platforms }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/test-override"
          expected="$image:v1.0.0,$image:latest,$image:custom-tag"
          test "$TAGS" = "$expected"
          test "$PLATFORMS" = "linux/amd64,linux/arm64"

  test-build-args:
    name: Local image build args (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: input
            build-args: INPUT_ARG1=input_value1,INPUT_ARG2=input_value2
            component: '[{"name":"test-buildargs-input","dockerfile":"./.qubership/Dockerfile.test","build_context":"."}]'
            expected-arg1: ""
            expected-arg2: ""
            expected-input-arg1: input_value1
            expected-input-arg2: input_value2
          - scenario: component-priority
            build-args: ARG1=ignored_value,INPUT_ARG1=ignored_input
            component: '[{"name":"test-buildargs-component","dockerfile":"./.qubership/Dockerfile.test","build_context":".","arguments":{"ARG1":"component_value1","ARG2":"component_value2"}}]'
            expected-arg1: component_value1
            expected-arg2: component_value2
            expected-input-arg1: ""
            expected-input-arg2: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build local image through Docker Action
        id: docker-buildargs
        uses: $/actions/docker-action
        with:
          checkout: "false"
          dry-run: "true"
          load: "true"
          setup-qemu: "false"
          registry: ghcr.io
          platforms: linux/amd64
          tags: ci-build-args
          build-args: ${{ matrix.build-args }}
          component: ${{ matrix.component }}

      - name: Verify build args inside the container
        shell: bash
        env:
          IMAGE_REF: ${{ steps.docker-buildargs.outputs.final-tags }}
          EXPECTED_ARG1: ${{ matrix.expected-arg1 }}
          EXPECTED_ARG2: ${{ matrix.expected-arg2 }}
          EXPECTED_INPUT_ARG1: ${{ matrix.expected-input-arg1 }}
          EXPECTED_INPUT_ARG2: ${{ matrix.expected-input-arg2 }}
        run: |
          docker image inspect "$IMAGE_REF" > /dev/null
          docker run --rm "$IMAGE_REF" > "$RUNNER_TEMP/actual-build-args.txt"
          printf 'Test Docker Image\nARG1=%s\nARG2=%s\nINPUT_ARG1=%s\nINPUT_ARG2=%s\n' \
            "$EXPECTED_ARG1" "$EXPECTED_ARG2" \
            "$EXPECTED_INPUT_ARG1" "$EXPECTED_INPUT_ARG2" \
            > "$RUNNER_TEMP/expected-build-args.txt"
          diff -u "$RUNNER_TEMP/expected-build-args.txt" "$RUNNER_TEMP/actual-build-args.txt"

  test-platforms:
    name: Test Multi-Platform Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Docker Action with Multiple Platforms
        id: docker-multiplatform
        uses: $/actions/docker-action
        with:
          dry-run: "true"
          outputs: type=oci,dest=${{ runner.temp }}/docker-platforms.tar
          registry: "ghcr.io"
          platforms: "linux/amd64,linux/arm64,linux/arm/v7"
          component: '[{"name": "test-multiplatform", "dockerfile": "./.qubership/Dockerfile.test", "build_context": "."}]'

      - name: Verify platforms in the built OCI archive
        env:
          FINAL_PLATFORMS: ${{ steps.docker-multiplatform.outputs.final-platforms }}
        run: |
          test "$FINAL_PLATFORMS" = "linux/amd64,linux/arm64,linux/arm/v7"
          mkdir "$RUNNER_TEMP/docker-platforms"
          tar -xf "$RUNNER_TEMP/docker-platforms.tar" -C "$RUNNER_TEMP/docker-platforms"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "docker-platforms"
          platforms = set()

          def inspect_index(index):
              for descriptor in index.get("manifests", []):
                  platform = descriptor.get("platform", {})
                  architecture = platform.get("architecture")
                  if platform.get("os") == "linux" and architecture in {"amd64", "arm64", "arm"}:
                      name = "linux/" + architecture
                      if architecture == "arm":
                          name += "/" + platform.get("variant", "")
                      platforms.add(name)
                  else:
                      algorithm, digest = descriptor["digest"].split(":", 1)
                      child = json.loads((root / "blobs" / algorithm / digest).read_text())
                      inspect_index(child)

          inspect_index(json.loads((root / "index.json").read_text()))
          expected = {"linux/amd64", "linux/arm64", "linux/arm/v7"}
          if platforms != expected:
              raise SystemExit(f"Expected {expected}, got {platforms}")
          print("Verified OCI platforms", sorted(platforms))
          PY

  test-component-aliases:
    name: Test Component Aliases (file/context)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Docker Action with Deprecated Component Keys
        id: docker-aliases
        uses: $/actions/docker-action
        with:
          dry-run: "true"
          registry: "ghcr.io"
          component: '[{"name": "test-aliases", "file": "./.qubership/Dockerfile.test", "context": "."}]'

      - name: Verify Component Aliases Output
        shell: bash
        env:
          ACTION_COMPONENT_NAME: ${{ steps.docker-aliases.outputs.component-name }}
          ACTION_COMPONENT_FILE: ${{ steps.docker-aliases.outputs.component-file }}
          ACTION_COMPONENT_CONTEXT: ${{ steps.docker-aliases.outputs.component-context }}
        run: |
          echo "=== Outputs ==="
          echo "Component Name: $ACTION_COMPONENT_NAME"
          echo "Component File: $ACTION_COMPONENT_FILE"
          echo "Component Context: $ACTION_COMPONENT_CONTEXT"

          if [ "$ACTION_COMPONENT_NAME" != "test-aliases" ]; then
            echo "❌ ERROR: Component name mismatch for aliases"
            exit 1
          fi

          if [ "$ACTION_COMPONENT_FILE" != "./.qubership/Dockerfile.test" ]; then
            echo "❌ ERROR: Component file mismatch for aliases"
            exit 1
          fi

          if [ "$ACTION_COMPONENT_CONTEXT" != "." ]; then
            echo "❌ ERROR: Component context mismatch for aliases"
            exit 1
          fi

          echo "✅ All component alias tests passed!"

  test-local-cache:
    name: Local build cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export build cache
        uses: $/actions/docker-action
        with:
          checkout: "false"
          dry-run: "true"
          setup-qemu: "false"
          tags: cache-test
          component: '[{"name":"test-cache","dockerfile":"./.qubership/Dockerfile.test","build_context":"."}]'
          cache-to: type=local,dest=${{ runner.temp }}/docker-cache,mode=max

      - name: Verify exported cache
        run: |
          test -s "$RUNNER_TEMP/docker-cache/index.json"
          jq -e '.schemaVersion == 2 and (.manifests | length > 0)' "$RUNNER_TEMP/docker-cache/index.json"

      - name: Rebuild using exported cache
        id: cached
        uses: $/actions/docker-action
        with:
          checkout: "false"
          dry-run: "true"
          setup-qemu: "false"
          setup-buildx: "false"
          load: "true"
          tags: cache-test
          component: '[{"name":"test-cache","dockerfile":"./.qubership/Dockerfile.test","build_context":"."}]'
          cache-from: type=local,src=${{ runner.temp }}/docker-cache

      - name: Run image built with cache
        env:
          IMAGE_REF: ${{ steps.cached.outputs.final-tags }}
        run: |
          docker run --rm "$IMAGE_REF" > "$RUNNER_TEMP/cached-image.txt"
          printf 'Test Docker Image\nARG1=\nARG2=\nINPUT_ARG1=\nINPUT_ARG2=\n' > "$RUNNER_TEMP/expected-cached-image.txt"
          diff -u "$RUNNER_TEMP/expected-cached-image.txt" "$RUNNER_TEMP/cached-image.txt"

  report:
    name: Docker Action Report
    if: ${{ always() && !cancelled() }}
    needs:
      - test-with-default-action
      - test-auto-tags
      - test-custom-tags
      - test-build-args
      - test-platforms
      - test-component-aliases
      - test-local-cache
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Write test summary
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          DEFAULTS: ${{ needs.test-with-default-action.result }}
          AUTO_TAGS: ${{ needs.test-auto-tags.result }}
          CUSTOM_TAGS: ${{ needs.test-custom-tags.result }}
          BUILD_ARGS: ${{ needs.test-build-args.result }}
          PLATFORMS: ${{ needs.test-platforms.result }}
          ALIASES: ${{ needs.test-component-aliases.result }}
          CACHE: ${{ needs.test-local-cache.result }}
        run: |
          status_label() {
            case "$1" in
              success) printf '✅ Passed' ;;
              failure) printf '❌ Failed' ;;
              skipped) printf '⏭️ Skipped' ;;
              cancelled) printf '⛔ Cancelled' ;;
              *) printf '❔ Unknown' ;;
            esac
          }

          overall=success
          for result in "$DEFAULTS" "$AUTO_TAGS" "$CUSTOM_TAGS" "$BUILD_ARGS" "$PLATFORMS" "$ALIASES" "$CACHE"; do
            if [[ "$result" == failure ]]; then
              overall=failure
              break
            fi
            if [[ "$result" != success ]]; then
              overall=skipped
            fi
          done

          {
            echo '<!-- docker-action-test-report -->'
            printf '## Docker action · %s\n\n' "$(status_label "$overall")"
            echo '**Build mode** · dry-run'
            echo
            echo '| Test | Result |'
            echo '| --- | --- |'
            printf '| Default component and image name | %s |\n' "$(status_label "$DEFAULTS")"
            printf '| Automatic tags | %s |\n' "$(status_label "$AUTO_TAGS")"
            printf '| Custom tags and image name override | %s |\n' "$(status_label "$CUSTOM_TAGS")"
            printf '| Build args inside containers — input and component priority | %s |\n' "$(status_label "$BUILD_ARGS")"
            printf '| OCI platforms — amd64, arm64, arm/v7 | %s |\n' "$(status_label "$PLATFORMS")"
            printf '| Component aliases | %s |\n' "$(status_label "$ALIASES")"
            printf '| Local cache export, import and container execution | %s |\n' "$(status_label "$CACHE")"
            echo
            echo "[View workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo '<details>'
            echo '<summary>Tested revision</summary>'
            echo
            echo "PR revision: $HEAD_SHA"
            echo
            echo "Tested commit: $TESTED_SHA"
            echo
            echo '</details>'
          } > "$RUNNER_TEMP/docker-action-report.md"
          cat "$RUNNER_TEMP/docker-action-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update Renovate PR comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'renovate[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          target="repos/$GITHUB_REPOSITORY"
          if [[ "$(gh api "$target/pulls/$PR_NUMBER" --jq .head.sha)" != "$HEAD_SHA" ]]; then
            exit 0
          fi

          comment_id="$(gh api --paginate "$target/issues/$PR_NUMBER/comments" --jq '
            .[] | select(.user.login == "github-actions[bot]" and
              (.body | startswith("<!-- docker-action-test-report -->"))) | .id
          ' | tail -n 1)"
          report="$RUNNER_TEMP/docker-action-report.md"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "$target/issues/comments/$comment_id" -F body=@"$report" --silent
          else
            gh api --method POST "$target/issues/$PR_NUMBER/comments" -F body=@"$report" --silent
          fi

      - name: Require successful validation
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $JOB_RESULTS; do
            if [[ "$result" != success ]]; then
              exit 1
            fi
          done
