name: TEST assets-action

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'actions/assets-action/**'
      - 'packages/action-logger/**'
      - '.github/workflows/test-assets-action.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests and Bundle Verification
    outputs:
      tests: ${{ steps.tests.outcome }}
      build: ${{ steps.build.outcome }}
      dist: ${{ steps.verify-dist.outcome }}
      bundle-changed: ${{ steps.verify-dist.outputs.changed }}
      bundle-artifact: ${{ steps.bundle.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        working-directory: actions/assets-action
        run: npm ci

      - name: Run unit tests
        id: tests
        working-directory: actions/assets-action
        run: npm test

      - name: Build dist
        id: build
        working-directory: actions/assets-action
        run: |
          rm -f dist/index.js
          npm run build
          test -s dist/index.js

      - name: Compare checked-in and rebuilt dist
        id: verify-dist
        env:
          AUTOCOMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ -n "$(git status --porcelain -- actions/assets-action/dist/)" ]]; then
            if [[ "$AUTOCOMMIT" == true ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Rebuild and commit assets-action/dist in the PR branch before running action tests."
              exit 1
            fi
          fi

      - name: Upload bundle for Renovate commit
        id: bundle
        if: steps.verify-dist.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-action-dist-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: actions/assets-action/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  test-upload:
    name: Upload and verify archive (${{ matrix.archive-type }})
    needs: [unit-tests, commit-bundle]
    if: >-
      needs.commit-bundle.outputs.ready == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        archive-type: [zip, tar, tar.gz]
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TEST_TAG: test-assets-action-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.archive-type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create test files
        run: |
          mkdir -p "$RUNNER_TEMP/test-assets/nested"
          printf 'test content 1\n' > "$RUNNER_TEMP/test-assets/file1.txt"
          printf 'test content 2\n' > "$RUNNER_TEMP/test-assets/nested/file2.txt"
          printf 'single file\n' > "$RUNNER_TEMP/single.txt"

      - name: Create isolated draft release
        id: create-release
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release create "$TEST_TAG" --target "$TARGET_SHA" --draft --prerelease             --title "Test release for assets-action" --notes "Automated test release"

      - name: Run Assets Action
        uses: $/actions/assets-action
        with:
          tag: ${{ env.TEST_TAG }}
          item-path: ${{ runner.temp }}/test-assets,${{ runner.temp }}/single.txt
          archive-type: ${{ matrix.archive-type }}

      - name: Verify uploaded file and archive contents
        env:
          ARCHIVE_TYPE: ${{ matrix.archive-type }}
        run: |
          expected=$(printf 'single.txt\ntest-assets.%s\n' "$ARCHIVE_TYPE" | sort)
          actual=$(gh release view "$TEST_TAG" --json assets --jq '.assets[].name' | sort)
          test "$actual" = "$expected"
          mkdir "$RUNNER_TEMP/downloaded" "$RUNNER_TEMP/extracted"
          gh release download "$TEST_TAG" --dir "$RUNNER_TEMP/downloaded"
          diff -u "$RUNNER_TEMP/single.txt" "$RUNNER_TEMP/downloaded/single.txt"
          archive="$RUNNER_TEMP/downloaded/test-assets.$ARCHIVE_TYPE"
          if [[ "$ARCHIVE_TYPE" == zip ]]; then
            unzip -q "$archive" -d "$RUNNER_TEMP/extracted"
          else
            tar -xf "$archive" -C "$RUNNER_TEMP/extracted"
          fi
          diff -r "$RUNNER_TEMP/test-assets" "$RUNNER_TEMP/extracted"

      - name: Remove test release and tag
        if: ${{ always() && steps.create-release.outcome != 'skipped' }}
        run: |
          if gh release view "$TEST_TAG" > /dev/null 2>&1; then
            gh release delete "$TEST_TAG" --yes
          fi
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TEST_TAG" --jq '.[].ref')
          if grep -Fxq "refs/tags/$TEST_TAG" <<< "$refs"; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TEST_TAG"
          fi
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TEST_TAG" --jq '.[].ref')
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq "refs/tags/$TEST_TAG" <<< "$refs" || grep -Fxq "$TEST_TAG" <<< "$releases"; then
            echo "::error::Test release or tag still exists: $TEST_TAG"
            exit 1
          fi

  commit-bundle:
    name: Commit assets-action bundle
    needs: unit-tests
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.commit.outputs.ready }}
    steps:
      - name: Checkout source for bundle commit
        if: needs.unit-tests.outputs.bundle-changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download rebuilt bundle
        if: needs.unit-tests.outputs.bundle-changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.unit-tests.outputs.bundle-artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/rebuilt-bundle

      - name: Create repository-scoped app token
        if: needs.unit-tests.outputs.bundle-changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.GH_BUMP_VERSION_APP_ID }}
          private-key: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}
          permission-contents: write

      - name: Commit bundle or continue integration tests
        id: commit
        env:
          BUNDLE_CHANGED: ${{ needs.unit-tests.outputs.bundle-changed }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$BUNDLE_CHANGED" != true ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s "$RUNNER_TEMP/rebuilt-bundle/index.js"
          if [[ -n "$(find "$RUNNER_TEMP/rebuilt-bundle" -type l -print -quit)" ]]; then
            echo '::error::Bundle contains a symbolic link'
            exit 1
          fi
          gh auth setup-git
          remote_sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f 1)
          if [[ "$remote_sha" != "$HEAD_SHA" ]]; then
            echo 'PR changed during this build. Its newer run will rebuild the current bundle.'
            exit 0
          fi
          rm -rf actions/assets-action/dist
          mkdir -p actions/assets-action/dist
          cp -a "$RUNNER_TEMP/rebuilt-bundle/." actions/assets-action/dist/
          git add -- actions/assets-action/dist/
          git -c core.hooksPath=/dev/null \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(deps): rebuild assets-action bundle'
          if ! git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$BRANCH"; then
            remote_sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f 1)
            if [[ "$remote_sha" != "$HEAD_SHA" ]]; then
              echo 'Another workflow updated this PR. Its newer run will retry the bundle.'
              exit 0
            fi
            echo '::error::Could not push the rebuilt bundle'
            exit 1
          fi
          echo 'Bundle committed. The App push starts PR checks on the new commit.'

  report:
    name: assets-action Report
    if: ${{ always() && !cancelled() }}
    needs: [unit-tests, commit-bundle, test-upload]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Write test summary
        if: needs.commit-bundle.outputs.ready == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          TESTS: ${{ needs.unit-tests.outputs.tests }}
          BUILD: ${{ needs.unit-tests.outputs.build }}
          DISPATCH: ${{ needs.test-upload.result }}
          DIST: ${{ needs.unit-tests.outputs.dist }}
        run: |
          status_label() {
            case "$1" in
              success) printf '✅ Passed' ;;
              failure) printf '❌ Failed' ;;
              skipped) printf '⏭️ Skipped' ;;
              cancelled) printf '⛔ Cancelled' ;;
              *) printf '❔ Unknown' ;;
            esac
          }

          overall=success
          for result in "${TESTS:-skipped}" "${BUILD:-skipped}" "${DISPATCH:-skipped}" "${DIST:-skipped}"; do
            if [[ "$result" == failure ]]; then
              overall=failure
              break
            fi
            if [[ "$result" != success ]]; then
              overall=skipped
            fi
          done

          {
            echo '<!-- assets-action-test-report -->'
            printf '## Release assets · %s\n\n' "$(status_label "$overall")"
            echo
            echo '| Test | Result |'
            echo '| --- | --- |'
            printf '| Unit tests | %s |\n' "$(status_label "${TESTS:-skipped}")"
            printf '| Bundle build | %s |\n' "$(status_label "${BUILD:-skipped}")"
            printf '| Archive upload, contents and cleanup | %s |\n' "$(status_label "${DISPATCH:-skipped}")"
            printf '| Bundle matches committed dist | %s |\n' "$(status_label "${DIST:-skipped}")"
            echo
            echo "[View workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo '<details>'
            echo '<summary>Tested revision</summary>'
            echo
            echo "PR revision: $HEAD_SHA"
            echo
            echo "Tested commit: $TESTED_SHA"
            echo
            echo '</details>'
          } > "$RUNNER_TEMP/assets-action-report.md"
          cat "$RUNNER_TEMP/assets-action-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update Renovate PR comment
        if: >-
          needs.commit-bundle.outputs.ready == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'renovate[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          target="repos/$GITHUB_REPOSITORY"
          if [[ "$(gh api "$target/pulls/$PR_NUMBER" --jq .head.sha)" != "$HEAD_SHA" ]]; then
            exit 0
          fi

          comment_id="$(gh api --paginate "$target/issues/$PR_NUMBER/comments" --jq '
            .[] | select(.user.login == "github-actions[bot]" and
              (.body | startswith("<!-- assets-action-test-report -->"))) | .id
          ' | tail -n 1)"
          report="$RUNNER_TEMP/assets-action-report.md"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "$target/issues/comments/$comment_id" -F body=@"$report" --silent
          else
            gh api --method POST "$target/issues/$PR_NUMBER/comments" -F body=@"$report" --silent
          fi

      - name: Require successful validation
        if: needs.commit-bundle.outputs.ready == 'true'
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $JOB_RESULTS; do
            if [[ "$result" != success ]]; then
              exit 1
            fi
          done

      - name: Require successful bundle preparation
        if: needs.unit-tests.result != 'success' || needs.commit-bundle.result != 'success'
        run: |
          echo '::error::Unit tests, bundle build, or bundle commit failed.'
          exit 1
