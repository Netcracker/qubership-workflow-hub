name: TEST copy-files-action

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "actions/copy-files-action/**"
      - ".github/workflows/test-copy-files-action.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Fixtures
        shell: bash
        run: |
          # positive cases
          mkdir -p test-fixtures/docs/examples
          echo "content-a" > test-fixtures/docs/a.md
          echo "one-src" > test-fixtures/docs/examples/one.md
          echo "two-src" > test-fixtures/docs/examples/two.md
          mkdir -p test-fixtures/dest-examples
          echo "one-stale" > test-fixtures/dest-examples/one.md
          mkdir -p test-fixtures/empty-src
          echo "content-a" > test-fixtures/already-there.md

          # negative cases
          mkdir -p test-fixtures/docs-with-link
          echo "secret" > /tmp/outside-secret.txt
          ln -s /tmp/outside-secret.txt test-fixtures/docs/source-link.md
          echo "real" > test-fixtures/docs-with-link/real.md
          ln -s /tmp/outside-secret.txt test-fixtures/docs-with-link/link.md
          ln -s /tmp test-fixtures/dest-parent-link
          mkdir -p test-fixtures/is-a-dir
          echo "x" > test-fixtures/is-a-file

      - name: Copy File, Directory, Empty Directory, and Identical File
        id: copy
        uses: ./actions/copy-files-action
        with:
          files: |
            [
              { "from": "test-fixtures/docs/a.md", "to": "test-fixtures/out/a.md" },
              { "from": "test-fixtures/docs/examples", "to": "test-fixtures/dest-examples", "overwrite": false },
              { "from": "test-fixtures/empty-src", "to": "test-fixtures/empty-dest" },
              { "from": "test-fixtures/docs/a.md", "to": "test-fixtures/already-there.md" }
            ]

      - name: Verify Positive Results
        shell: bash
        env:
          CHANGED: ${{ steps.copy.outputs.changed }}
          CHANGED_COUNT: ${{ steps.copy.outputs.changed-count }}
          SKIPPED_COUNT: ${{ steps.copy.outputs.skipped-count }}
        run: |
          FAILED=0

          [ "$(cat test-fixtures/out/a.md)" = "content-a" ] || { echo "❌ file copy content mismatch"; FAILED=1; }
          [ "$(cat test-fixtures/dest-examples/one.md)" = "one-stale" ] || { echo "❌ overwrite:false must not touch existing one.md"; FAILED=1; }
          [ "$(cat test-fixtures/dest-examples/two.md)" = "two-src" ] || { echo "❌ overwrite:false must still copy new two.md"; FAILED=1; }
          [ -d test-fixtures/empty-dest ] || { echo "❌ empty source directory must still create destination"; FAILED=1; }
          # 2 changed: docs/a.md->out/a.md, examples/two.md; 2 skipped: examples/one.md (overwrite:false), already-there.md (identical content)
          [ "$CHANGED" = "true" ] || { echo "❌ expected changed=true, got: $CHANGED"; FAILED=1; }
          [ "$CHANGED_COUNT" = "2" ] || { echo "❌ expected changed-count=2, got: $CHANGED_COUNT"; FAILED=1; }
          [ "$SKIPPED_COUNT" = "2" ] || { echo "❌ expected skipped-count=2, got: $SKIPPED_COUNT"; FAILED=1; }

          [ "$FAILED" -eq 0 ] && echo "✅ Positive checks passed"
          exit $FAILED

      - name: Not An Array Must Fail
        id: not-array
        continue-on-error: true
        uses: ./actions/copy-files-action
        with:
          files: '{"from": "a", "to": "b"}'

      - name: Missing Source Must Fail
        id: missing-source
        continue-on-error: true
        uses: ./actions/copy-files-action
        with:
          files: '[{"from": "test-fixtures/docs/does-not-exist.md", "to": "test-fixtures/out2.md"}]'

      - name: Path Escape Must Fail
        id: escape
        continue-on-error: true
        uses: ./actions/copy-files-action
        with:
          files: '[{"from": "test-fixtures/docs/a.md", "to": "../escape.md"}]'

      - name: Source Symlink Must Fail
        id: source-symlink
        continue-on-error: true
        uses: ./actions/copy-files-action
        with:
          files: '[{"from": "test-fixtures/docs/source-link.md", "to": "test-fixtures/out-link.md"}]'

      - name: Source Directory Containing Symlink Must Fail
        id: source-dir-symlink
        continue-on-error: true
        uses: ./actions/copy-files-action
        with:
          files: '[{"from": "test-fixtures/docs-with-link", "to": "test-fixtures/out-dir-link"}]'

      - name: Destination Parent Symlink Must Fail
        id: dest-parent-symlink
        continue-on-error: true
        uses: ./actions/copy-files-action
        with:
          files: '[{"from": "test-fixtures/docs/a.md", "to": "test-fixtures/dest-parent-link/a.md"}]'

      - name: File Onto Existing Directory Must Fail
        id: file-onto-dir
        continue-on-error: true
        uses: ./actions/copy-files-action
        with:
          files: '[{"from": "test-fixtures/docs/a.md", "to": "test-fixtures/is-a-dir"}]'

      - name: Directory Onto Existing File Must Fail
        id: dir-onto-file
        continue-on-error: true
        uses: ./actions/copy-files-action
        with:
          files: '[{"from": "test-fixtures/docs-with-link", "to": "test-fixtures/is-a-file"}]'

      - name: Verify All Failure Modes
        shell: bash
        env:
          NOT_ARRAY: ${{ steps.not-array.outcome }}
          MISSING_SOURCE: ${{ steps.missing-source.outcome }}
          ESCAPE: ${{ steps.escape.outcome }}
          SOURCE_SYMLINK: ${{ steps.source-symlink.outcome }}
          SOURCE_DIR_SYMLINK: ${{ steps.source-dir-symlink.outcome }}
          DEST_PARENT_SYMLINK: ${{ steps.dest-parent-symlink.outcome }}
          FILE_ONTO_DIR: ${{ steps.file-onto-dir.outcome }}
          DIR_ONTO_FILE: ${{ steps.dir-onto-file.outcome }}
        run: |
          FAILED=0
          expect_failure() {
            if [ "$2" != "failure" ]; then
              echo "❌ ERROR: $1 should have failed, outcome: $2"
              FAILED=1
            else
              echo "✅ $1 failed as expected"
            fi
          }

          expect_failure "files not an array" "$NOT_ARRAY"
          expect_failure "missing source" "$MISSING_SOURCE"
          expect_failure "path escape" "$ESCAPE"
          expect_failure "source symlink" "$SOURCE_SYMLINK"
          expect_failure "source directory containing symlink" "$SOURCE_DIR_SYMLINK"
          expect_failure "destination parent symlink" "$DEST_PARENT_SYMLINK"
          expect_failure "file onto existing directory" "$FILE_ONTO_DIR"
          expect_failure "directory onto existing file" "$DIR_ONTO_FILE"

          exit $FAILED
