name: TEST pr-assigner

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'actions/pr-assigner/**'
      - 'packages/action-logger/**'
      - '.github/workflows/test-pr-assigner.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests and Bundle Verification
    outputs:
      tests: ${{ steps.tests.outcome }}
      build: ${{ steps.build.outcome }}
      dist: ${{ steps.verify-dist.outcome }}
      bundle-changed: ${{ steps.verify-dist.outputs.changed }}
      bundle-artifact: ${{ steps.bundle.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        working-directory: actions/pr-assigner
        run: npm ci

      - name: Run unit tests
        id: tests
        working-directory: actions/pr-assigner
        run: npm test

      - name: Build dist
        id: build
        working-directory: actions/pr-assigner
        run: |
          rm -f dist/index.js
          npm run build
          test -s dist/index.js

      - name: Compare checked-in and rebuilt dist
        id: verify-dist
        env:
          AUTOCOMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ -n "$(git status --porcelain -- actions/pr-assigner/dist/)" ]]; then
            if [[ "$AUTOCOMMIT" == true ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Rebuild and commit pr-assigner/dist in the PR branch before running action tests."
              exit 1
            fi
          fi

      - name: Upload bundle for Renovate commit
        id: bundle
        if: steps.verify-dist.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-assigner-dist-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: actions/pr-assigner/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  test-assign:
    name: Assign and verify PR users
    needs: [unit-tests, commit-bundle]
    if: >-
      needs.commit-bundle.outputs.ready == 'true' &&
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare PR context and assignment fixture
        id: prepare
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr-before.json"
          candidate=$(jq -r '.assignees[0].login // empty' "$RUNNER_TEMP/pr-before.json")
          if [[ -z "$candidate" ]]; then
            candidate=$(gh api "repos/$GITHUB_REPOSITORY/assignees?per_page=1" --jq '.[0].login')
            echo "restore=true" >> "$GITHUB_OUTPUT"
          fi
          test -n "$candidate"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          jq -n --arg user "$candidate" '{assignees: [$user], count: 1}' > "$RUNNER_TEMP/pr-assigner-config.json"

      - name: Run PR Assigner
        id: assign
        uses: $/actions/pr-assigner
        with:
          configuration-path: ${{ runner.temp }}/pr-assigner-config.json
          self-assign: "false"

      - name: Verify assigned users
        env:
          CANDIDATE: ${{ steps.prepare.outputs.candidate }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr-after.json"
          jq -e --arg user "$CANDIDATE" 'any(.assignees[]; .login == $user)' "$RUNNER_TEMP/pr-after.json"
          jq -e --slurpfile before "$RUNNER_TEMP/pr-before.json"             '([$before[0].assignees[].login] - [.assignees[].login]) | length == 0'             "$RUNNER_TEMP/pr-after.json"

      - name: Restore temporary assignment
        if: ${{ always() && steps.assign.outcome != 'skipped' && steps.prepare.outputs.restore == 'true' }}
        env:
          CANDIDATE: ${{ steps.prepare.outputs.candidate }}
        run: |
          gh pr edit "$PR_NUMBER" --remove-assignee "$CANDIDATE"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"             --jq '.assignees[].login' > "$RUNNER_TEMP/remaining-assignees.txt"
          if grep -Fxq "$CANDIDATE" "$RUNNER_TEMP/remaining-assignees.txt"; then
            echo "::error::Temporary assignment remains"
            exit 1
          fi

  commit-bundle:
    name: Commit pr-assigner bundle
    needs: unit-tests
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.commit.outputs.ready }}
    steps:
      - name: Checkout source for bundle commit
        if: needs.unit-tests.outputs.bundle-changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download rebuilt bundle
        if: needs.unit-tests.outputs.bundle-changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.unit-tests.outputs.bundle-artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/rebuilt-bundle

      - name: Create repository-scoped app token
        if: needs.unit-tests.outputs.bundle-changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.GH_BUMP_VERSION_APP_ID }}
          private-key: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}
          permission-contents: write

      - name: Commit bundle or continue integration tests
        id: commit
        env:
          BUNDLE_CHANGED: ${{ needs.unit-tests.outputs.bundle-changed }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$BUNDLE_CHANGED" != true ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s "$RUNNER_TEMP/rebuilt-bundle/index.js"
          if [[ -n "$(find "$RUNNER_TEMP/rebuilt-bundle" -type l -print -quit)" ]]; then
            echo '::error::Bundle contains a symbolic link'
            exit 1
          fi
          gh auth setup-git
          remote_sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f 1)
          if [[ "$remote_sha" != "$HEAD_SHA" ]]; then
            echo 'PR changed during this build. Its newer run will rebuild the current bundle.'
            exit 0
          fi
          rm -rf actions/pr-assigner/dist
          mkdir -p actions/pr-assigner/dist
          cp -a "$RUNNER_TEMP/rebuilt-bundle/." actions/pr-assigner/dist/
          git add -- actions/pr-assigner/dist/
          git -c core.hooksPath=/dev/null \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(deps): rebuild pr-assigner bundle'
          if ! git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$BRANCH"; then
            remote_sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f 1)
            if [[ "$remote_sha" != "$HEAD_SHA" ]]; then
              echo 'Another workflow updated this PR. Its newer run will retry the bundle.'
              exit 0
            fi
            echo '::error::Could not push the rebuilt bundle'
            exit 1
          fi
          echo 'Bundle committed. The App push starts PR checks on the new commit.'

  report:
    name: pr-assigner Report
    if: ${{ always() && !cancelled() }}
    needs: [unit-tests, commit-bundle, test-assign]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Write test summary
        if: needs.commit-bundle.outputs.ready == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          TESTS: ${{ needs.unit-tests.outputs.tests }}
          BUILD: ${{ needs.unit-tests.outputs.build }}
          DISPATCH: ${{ needs.test-assign.result }}
          DIST: ${{ needs.unit-tests.outputs.dist }}
        run: |
          status_label() {
            case "$1" in
              success) printf '✅ Passed' ;;
              failure) printf '❌ Failed' ;;
              skipped) printf '⏭️ Skipped' ;;
              cancelled) printf '⛔ Cancelled' ;;
              *) printf '❔ Unknown' ;;
            esac
          }

          overall=success
          for result in "${TESTS:-skipped}" "${BUILD:-skipped}" "${DISPATCH:-skipped}" "${DIST:-skipped}"; do
            if [[ "$result" == failure ]]; then
              overall=failure
              break
            fi
            if [[ "$result" != success ]]; then
              overall=skipped
            fi
          done

          {
            echo '<!-- pr-assigner-test-report -->'
            printf '## PR assigner · %s\n\n' "$(status_label "$overall")"
            echo
            echo '| Test | Result |'
            echo '| --- | --- |'
            printf '| Unit tests | %s |\n' "$(status_label "${TESTS:-skipped}")"
            printf '| Bundle build | %s |\n' "$(status_label "${BUILD:-skipped}")"
            printf '| Assignment and cleanup | %s |\n' "$(status_label "${DISPATCH:-skipped}")"
            printf '| Bundle matches committed dist | %s |\n' "$(status_label "${DIST:-skipped}")"
            echo
            echo "[View workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo '<details>'
            echo '<summary>Tested revision</summary>'
            echo
            echo "PR revision: $HEAD_SHA"
            echo
            echo "Tested commit: $TESTED_SHA"
            echo
            echo '</details>'
          } > "$RUNNER_TEMP/pr-assigner-report.md"
          cat "$RUNNER_TEMP/pr-assigner-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update Renovate PR comment
        if: >-
          needs.commit-bundle.outputs.ready == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'renovate[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          target="repos/$GITHUB_REPOSITORY"
          if [[ "$(gh api "$target/pulls/$PR_NUMBER" --jq .head.sha)" != "$HEAD_SHA" ]]; then
            exit 0
          fi

          comment_id="$(gh api --paginate "$target/issues/$PR_NUMBER/comments" --jq '
            .[] | select(.user.login == "github-actions[bot]" and
              (.body | startswith("<!-- pr-assigner-test-report -->"))) | .id
          ' | tail -n 1)"
          report="$RUNNER_TEMP/pr-assigner-report.md"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "$target/issues/comments/$comment_id" -F body=@"$report" --silent
          else
            gh api --method POST "$target/issues/$PR_NUMBER/comments" -F body=@"$report" --silent
          fi

      - name: Require successful validation
        if: needs.commit-bundle.outputs.ready == 'true'
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $JOB_RESULTS; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              exit 1
            fi
          done

      - name: Require successful bundle preparation
        if: needs.unit-tests.result != 'success' || needs.commit-bundle.result != 'success'
        run: |
          echo '::error::Unit tests, bundle build, or bundle commit failed.'
          exit 1
