name: TEST cla-assistant

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'actions/cla-assistant/**'
      - 'packages/action-logger/**'
      - '.github/workflows/test-cla-assistant.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests and Bundle Verification
    outputs:
      tests: ${{ steps.tests.outcome }}
      build: ${{ steps.build.outcome }}
      dist: ${{ steps.verify-dist.outcome }}
      bundle-changed: ${{ steps.verify-dist.outputs.changed }}
      bundle-artifact: ${{ steps.bundle.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        working-directory: actions/cla-assistant
        run: npm ci

      - name: Run unit tests
        id: tests
        working-directory: actions/cla-assistant
        run: npm test

      - name: Build dist
        id: build
        working-directory: actions/cla-assistant
        run: |
          rm -f dist/index.js
          npm run build
          test -s dist/index.js

      - name: Compare checked-in and rebuilt dist
        id: verify-dist
        env:
          AUTOCOMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ -n "$(git status --porcelain -- actions/cla-assistant/dist/)" ]]; then
            if [[ "$AUTOCOMMIT" == true ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Rebuild and commit cla-assistant/dist in the PR branch before running action tests."
              exit 1
            fi
          fi

      - name: Upload bundle for Renovate commit
        id: bundle
        if: steps.verify-dist.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cla-assistant-dist-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: actions/cla-assistant/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  test-cla:
    name: CLA behavior (${{ matrix.scenario }})
    needs: [unit-tests, commit-bundle]
    if: needs.commit-bundle.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: signed
            expected: success
            allowlist: ""
          - scenario: remote-storage
            expected: success
            allowlist: ""
            remote-repository: signature-store
            remote-organization: signature-owner
          - scenario: unsigned
            expected: failure
            allowlist: ""
          - scenario: new-signature
            expected: success
            allowlist: ""
          - scenario: allowlisted
            expected: success
            allowlist: alice
          - scenario: missing-storage
            expected: failure
            allowlist: ""
          - scenario: storage-error
            expected: failure
            allowlist: ""
    env:
      CLA_TEST_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Start local GitHub API fixture
        working-directory: actions/cla-assistant
        run: |
          export CLA_TEST_DIR="$RUNNER_TEMP/cla-fixture"
          echo "CLA_TEST_DIR=$CLA_TEST_DIR" >> "$GITHUB_ENV"
          mkdir "$CLA_TEST_DIR"
          node tests/fixtures/server.mjs > "$CLA_TEST_DIR/server.log" 2>&1 &
          echo "$!" > "$CLA_TEST_DIR/server.pid"
          for _ in {1..50}; do
            if [[ -s "$CLA_TEST_DIR/api-url" ]]; then
              exit 0
            fi
            sleep 0.1
          done
          cat "$CLA_TEST_DIR/server.log"
          exit 1

      - name: Run CLA Assistant through its manifest
        id: cla
        continue-on-error: true
        uses: $/actions/cla-assistant
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/actions/cla-assistant/tests/fixtures/preload.mjs
          GITHUB_TOKEN: cla-fixture-token
          PERSONAL_ACCESS_TOKEN: cla-fixture-pat
        with:
          path-to-signatures: signatures/cla.json
          branch: main
          remote-repository-name: ${{ matrix.remote-repository || '' }}
          remote-organization-name: ${{ matrix.remote-organization || '' }}
          path-to-document: https://example.com/cla
          use-dco-flag: "false"
          allowlist: ${{ matrix.allowlist }}

      - name: Verify outcome and API operations
        working-directory: actions/cla-assistant
        env:
          ACTUAL_OUTCOME: ${{ steps.cla.outcome }}
          EXPECTED_OUTCOME: ${{ matrix.expected }}
        run: |
          test "$ACTUAL_OUTCOME" = "$EXPECTED_OUTCOME"
          node tests/fixtures/verify.mjs

      - name: Stop fixture and remove temporary files
        if: ${{ always() }}
        run: |
          fixture="$RUNNER_TEMP/cla-fixture"
          if [[ -f "$fixture/server.pid" ]]; then
            pid=$(cat "$fixture/server.pid")
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"
            fi
          fi
          rm -rf "$fixture"

  commit-bundle:
    name: Commit cla-assistant bundle
    needs: unit-tests
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.commit.outputs.ready }}
    steps:
      - name: Checkout source for bundle commit
        if: needs.unit-tests.outputs.bundle-changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download rebuilt bundle
        if: needs.unit-tests.outputs.bundle-changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.unit-tests.outputs.bundle-artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/rebuilt-bundle

      - name: Create repository-scoped app token
        if: needs.unit-tests.outputs.bundle-changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.GH_BUMP_VERSION_APP_ID }}
          private-key: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}
          permission-contents: write

      - name: Commit bundle or continue integration tests
        id: commit
        env:
          BUNDLE_CHANGED: ${{ needs.unit-tests.outputs.bundle-changed }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$BUNDLE_CHANGED" != true ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s "$RUNNER_TEMP/rebuilt-bundle/index.js"
          if [[ -n "$(find "$RUNNER_TEMP/rebuilt-bundle" -type l -print -quit)" ]]; then
            echo '::error::Bundle contains a symbolic link'
            exit 1
          fi
          gh auth setup-git
          remote_sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f 1)
          if [[ "$remote_sha" != "$HEAD_SHA" ]]; then
            echo 'PR changed during this build. Its newer run will rebuild the current bundle.'
            exit 0
          fi
          rm -rf actions/cla-assistant/dist
          mkdir -p actions/cla-assistant/dist
          cp -a "$RUNNER_TEMP/rebuilt-bundle/." actions/cla-assistant/dist/
          git add -- actions/cla-assistant/dist/
          git -c core.hooksPath=/dev/null \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(deps): rebuild cla-assistant bundle'
          if ! git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$BRANCH"; then
            remote_sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f 1)
            if [[ "$remote_sha" != "$HEAD_SHA" ]]; then
              echo 'Another workflow updated this PR. Its newer run will retry the bundle.'
              exit 0
            fi
            echo '::error::Could not push the rebuilt bundle'
            exit 1
          fi
          echo 'Bundle committed. The App push starts PR checks on the new commit.'

  report:
    name: CLA Assistant Report
    if: ${{ always() && !cancelled() }}
    needs: [unit-tests, commit-bundle, test-cla]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Write test summary
        if: needs.commit-bundle.outputs.ready == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          TESTS: ${{ needs.unit-tests.outputs.tests }}
          BUILD: ${{ needs.unit-tests.outputs.build }}
          DISPATCH: ${{ needs.test-cla.result }}
          DIST: ${{ needs.unit-tests.outputs.dist }}
        run: |
          status_label() {
            case "$1" in
              success) printf '✅ Passed' ;;
              failure) printf '❌ Failed' ;;
              skipped) printf '⏭️ Skipped' ;;
              cancelled) printf '⛔ Cancelled' ;;
              *) printf '❔ Unknown' ;;
            esac
          }

          overall=success
          for result in "${TESTS:-skipped}" "${BUILD:-skipped}" "${DISPATCH:-skipped}" "${DIST:-skipped}"; do
            if [[ "$result" == failure ]]; then
              overall=failure
              break
            fi
            if [[ "$result" != success ]]; then
              overall=skipped
            fi
          done

          {
            echo '<!-- cla-assistant-test-report -->'
            printf '## CLA assistant · %s\n\n' "$(status_label "$overall")"
            echo
            echo '| Test | Result |'
            echo '| --- | --- |'
            printf '| Unit tests | %s |\n' "$(status_label "${TESTS:-skipped}")"
            printf '| Bundle build | %s |\n' "$(status_label "${BUILD:-skipped}")"
            printf '| CLA manifest and API scenarios | %s |\n' "$(status_label "${DISPATCH:-skipped}")"
            printf '| Bundle matches committed dist | %s |\n' "$(status_label "${DIST:-skipped}")"
            echo
            echo "[View workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo '<details>'
            echo '<summary>Tested revision</summary>'
            echo
            echo "PR revision: $HEAD_SHA"
            echo
            echo "Tested commit: $TESTED_SHA"
            echo
            echo '</details>'
          } > "$RUNNER_TEMP/cla-assistant-report.md"
          cat "$RUNNER_TEMP/cla-assistant-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update Renovate PR comment
        if: >-
          needs.commit-bundle.outputs.ready == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'renovate[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          target="repos/$GITHUB_REPOSITORY"
          if [[ "$(gh api "$target/pulls/$PR_NUMBER" --jq .head.sha)" != "$HEAD_SHA" ]]; then
            exit 0
          fi

          comment_id="$(gh api --paginate "$target/issues/$PR_NUMBER/comments" --jq '
            .[] | select(.user.login == "github-actions[bot]" and
              (.body | startswith("<!-- cla-assistant-test-report -->"))) | .id
          ' | tail -n 1)"
          report="$RUNNER_TEMP/cla-assistant-report.md"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "$target/issues/comments/$comment_id" -F body=@"$report" --silent
          else
            gh api --method POST "$target/issues/$PR_NUMBER/comments" -F body=@"$report" --silent
          fi

      - name: Require successful validation
        if: needs.commit-bundle.outputs.ready == 'true'
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $JOB_RESULTS; do
            if [[ "$result" != success ]]; then
              exit 1
            fi
          done

      - name: Require successful bundle preparation
        if: needs.unit-tests.result != 'success' || needs.commit-bundle.result != 'success'
        run: |
          echo '::error::Unit tests, bundle build, or bundle commit failed.'
          exit 1
