name: "Container Package Cleanup Action"
description: "Delete old GHCR container images or Maven package versions by age, version count, and tag include/exclude patterns; defaults to SNAPSHOT-only for Maven."
inputs:
  threshold-days:
    description: "The number of days to keep docker images."
    default: "7"
  threshold-versions:
    description: "The number of latest SNAPSHOT versions to keep."
    default: "1"
  included-tags:
    description: "A comma-separated list of tags to include for deletion. Merged with included-patterns."
    default: ""
  excluded-tags:
    description: "A comma-separated list of tags to exclude from deletion. Merged with excluded-patterns."
    default: ""
  debug:
    description: "Enable debug mode. Accepts true or false; any other value fails the action."
    default: "true"
  dry-run:
    description: "Enable dry run mode. Accepts true or false; any other value fails the action."
    default: "false"
  package-type:
    description: "Type of cleanup to perform (e.g., 'docker', 'container')."
    default: "container"
  included-patterns:
    description: "A comma-separated list of patterns to include for deletion. Merged with included-tags; for Maven *SNAPSHOT* is used when no include filter is given."
    default: ""
  excluded-patterns:
    description: "A comma-separated list of patterns to exclude from deletion. Merged with excluded-tags; exclusions always win over inclusions."
    default: ""
  batch-size:
    description: "Number of items to delete in each batch. A positive integer; an empty value or 0 uses the default."
    default: "15"
  max-errors:
    description: "Maximum number of delete processing errors allowed before stopping. A positive integer; an empty value or 0 uses the default."
    default: "5"
runs:
  using: "node24"
  main: "dist/index.js"

branding:
  icon: "edit"
  color: "yellow"