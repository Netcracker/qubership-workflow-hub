name: "Copy Files"
description: "Copies files and directories inside the workspace according to a JSON mapping of from/to entries"

inputs:
  files:
    description: "JSON array of source and destination mappings"
    required: true

outputs:
  changed:
    description: "Number of files actually written (new or with different content)"
  skipped:
    description: "Number of files skipped because the destination already existed with overwrite: false, or was already identical"

runs:
  using: "node24"
  main: "dist/index.js"