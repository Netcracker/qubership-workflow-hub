name: "Copy Files"
description: "Copies files and directories inside the workspace according to a JSON mapping of from/to entries"

inputs:
  files:
    description: "JSON array of source and destination mappings"
    required: true

outputs:
  copied:
    description: "Number of files copied"
  skipped:
    description: "Number of files skipped because the destination already existed and overwrite was false"

runs:
  using: "node24"
  main: "dist/index.js"