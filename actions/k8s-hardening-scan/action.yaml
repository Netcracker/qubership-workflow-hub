name: Kubescape Hardening Scan
description: Scan live Kubernetes Deployments and Helm charts for hardening compliance using Kubescape (NSA/MITRE/DevOpsBest) and Trivy, and gate the workflow on mandatory checks.
inputs:
  namespaces:
    type: string
  output-file:
    type: string
    default: "results.json"
  install-kubescape:
    type: string
    default: true
  execute-kubescape-scan:
    type: string
    default: true
  execute-trivy-scan:
    type: string
    default: false
  fail-on-mandatory-checks:
    type: string
    default: false
  config-file:
    type: string
    default: ".qubership/hardening-config.yaml"
  report-title:
    type: string
    default: "Hardening Scan Report"
runs:
  using: "composite"
  steps:
    - name: Install Kubescape
      if: inputs.install-kubescape == 'true'
      shell: bash
      run: |
        curl -s https://raw.githubusercontent.com/kubescape/kubescape/1d5520f7293f418dff829bfd7ed75b1f1867ea07/install.sh | /bin/bash

    - name: Scan with Kubescape (NSA + MITRE + DevOpsBest)
      if: inputs.execute-kubescape-scan == 'true'
      shell: bash
      run: |
        export PATH=$PATH:/home/runner/.kubescape/bin
        kubescape scan framework nsa,mitre,devopsbest \
          --include-namespaces ${{ inputs.namespaces }} \
          --verbose \
          --format json \
          --output kubescape-${{ inputs.output-file }} \
          --severity-threshold medium \
          --compliance-threshold 0   # (0-100)
      continue-on-error: true

    - name: Generate markdown report
      if: inputs.execute-kubescape-scan == 'true'
      shell: bash
      run: |
        python3 ${GITHUB_ACTION_PATH}/report-generator.py -i kubescape-${{ inputs.output-file }} -o kubescape-report.md -c "${{ inputs.config-file }}" -t "${{ inputs.report-title }}"
        cat kubescape-report.md >> $GITHUB_STEP_SUMMARY

    - name: Upload json as artifact
      if: inputs.execute-kubescape-scan == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: kubescape-${{ inputs.output-file }}
        archive: false

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        path: temp/repocode
        persist-credentials: false

    - name: Install Trivy
      if: inputs.execute-trivy-scan == 'true'
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        version: 0.76.1

    - name: Scan Helm chart with Trivy (misconfigurations + images)
      if: inputs.execute-trivy-scan == 'true'
      shell: bash
      working-directory: temp/repocode
      run: |
        trivy k8s --format json --include-namespaces ${{ inputs.namespaces }} --report all --output trivy-${{ inputs.output-file }}
      continue-on-error: true

    - name: Upload reports as artifact
      if: inputs.execute-trivy-scan == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: temp/repocode/trivy-*.*
        archive: true

    - name: Fail on mandatory checks failure
      if: inputs.fail-on-mandatory-checks == 'true'
      shell: bash
      run: |
        if [ -f failed_mandatory_checks.json ]; then
          echo -e "⚠️ \033[1;31mMandatory checks failed. Failing the workflow.\033[0m See '${{ inputs.report-title }}' in job summary for details."
          echo "⚠️ Mandatory checks failed. Failing the workflow." >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "\033[1;32mAll mandatory checks passed.\033[0m"
        fi
